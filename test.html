<!doctype html><html><head><meta charset="utf-8"><style>[hidden]{display:none!important}</style></head><body>
<!--GAME-->
<pre id="testout"></pre>
<script>
(() => {
  const out = []; const log = (...a) => { out.push(a.join(' ')); document.getElementById('testout').textContent = out.join('\n'); };
  window.addEventListener('error', e => log('WINDOW ERROR', e.message, e.lineno)); log('début');
  const _st = window.setTimeout;
  try{
    for (const r of ROOMS){ for (let level=1; level<=5; level++){ let kinds = {}; for (let i=0;i<25;i++){
      const q = r.boss ? GAMES.boss.gen(level, i%15, 15) : GAMES[r.id].gen(level);
      if (!q || !q.prompt || !q.kind) throw new Error('question invalide '+r.id);
      kinds[q.kind] = (kinds[q.kind]||0)+1;
      if (q.kind==='qcm'){ if (!q.options.map(String).includes(String(q.answer))) throw new Error('réponse absente '+r.id+' '+q.prompt+' '+q.answer+' '+q.options); if (new Set(q.options.map(String)).size!==q.options.length) throw new Error('doublons '+r.id+' '+q.options); }
      if (q.kind==='num' && typeof q.answer!=='number') throw new Error('num sans nombre '+r.id);
      const stage = document.createElement('div'); document.body.appendChild(stage);
      try{ if (q.kind==='custom') q.render(stage, {done:false, answer(){}}); else if (q.render) q.render(stage, {done:false, answer(){}}); }catch(e){ throw new Error('render '+r.id+' L'+level+' : '+e.message); }
      stage.remove();
    } log('OK', r.id, level, JSON.stringify(kinds)); } }
    // 2. moteur : les délais longs deviennent synchrones
    S.name='Test'; S.unlockAll = true;
    window.setTimeout = (f, ms, ...a) => { if (ms>=600){ f(...a); return 0; } return _st(f, ms, ...a); };
    for (const r of ROOMS){
      startRoom(r); let guard = 0;
      while (run && guard++<120){ const ok = Math.random()<.8; submit(ok, ok?'' :'x'); }
      log('salle', r.id, 'écran', screen, 'billes', S.billes, 'étoiles', S.stars, 'tours', guard, 'done', JSON.stringify(S.rooms[r.id]));
    }
    log('cœurs max', maxHearts(), 'délivrés', freedCount(), 'levels', JSON.stringify(Object.fromEntries(ROOMS.map(r=>[r.id, roomLevel(r.id)]))));
    if (ROOMS.every(r => isDone(r.id))){ $('#btn-res-map').click(); log('cycle écran', screen, 'cycle', S.cycle, 'found', freedCount()); $('#btn-cycle-next').click(); $('#btn-cycle-next').click(); log('panneau 3 chips', document.querySelectorAll('#cycle-scene .lvl').length); $('#btn-cycle-next').click(); log('après cycle écran', screen, 'salle courante', currentRoom() && currentRoom().id); }
    // migration d'une vieille sauvegarde
    const old = {done:2, best:0, perfect:1}; S.rooms.formes = old; migrate(); log('migration', JSON.stringify(S.rooms.formes));
    for (let b=1;b<=10;b++){ recordFact(2,b,true); recordFact(2,b,true); } checkTables(); log('table 2 maîtrisée', tableMastered(2), 'file', JSON.stringify(S.celebrateQueue), 'actives', JSON.stringify(activeTables()));
    let celebrated = false; maybeCelebrate(() => { celebrated = true; }); log('célébration affichée', !$('#celebrate').hidden, 'titre', $('#celebrate-title').textContent); $('#btn-celebrate').click(); log('après célébration, then appelé', celebrated, 'hidden', $('#celebrate').hidden, 'file', JSON.stringify(S.celebrateQueue));
    recordFact(3,4,false); recordSkill('bains', false); recordSkill('bains', true); renderCarnet(); log('carnet tables', document.querySelectorAll('#carnet-tables .tcard').length, 'skills', document.querySelectorAll('#carnet-skills .srow').length, 'hint', $('#carnet-hint').textContent);
    startRoom(ROOM.revision); log('révision', run && run.room, 'q', run && run.q.prompt.slice(0,40)); let g2=0; while (run && g2++<40){ submit(true); } log('révision finie écran', screen, 'titre', $('#res-title').textContent, 'level bains', roomLevel('bains'));
    const picks = {}; for (let i=0;i<300;i++){ const [a,b] = pickFact(activeTables()); picks[a] = (picks[a]||0)+1; } log('tirages par table', JSON.stringify(picks));
    for (let f=0; f<4; f++){ openMap(f); drawMap(); } log('carte OK');
    startStorm(null, true); log('orage phase', storm && storm.phase); if (storm){ if (storm.phase!=='play'){ storm.phase='play'; launchPumpkin(); } stormHit(true); if (storm) { launchPumpkin(); stormHit(false); } } log('orage OK, storm =', storm ? 'actif' : 'fermé', 'billes', S.billes);
    renderAlbum(); renderHome(); log('home/album OK');
    S.unlockAll = false; S.rooms = {}; hero.floor = -1; openMap(0); log('hero', JSON.stringify(hero));
    log('accès RDC', ROOMS.filter(r=>r.floor===0).map(r=>roomUnlocked(r)).join(','), '1er fermé', !roomUnlocked(ROOM.complements), 'boss fermé', !roomUnlocked(ROOM.boss)); ROOMS.filter(r=>r.floor===0).forEach(r=>{roomState(r.id).found=true;}); log('après RDC : 1er ouvert', roomUnlocked(ROOM.complements), '2e fermé', !roomUnlocked(ROOM.addition), 'hint', $('#maphint').textContent.slice(0,40));
    log('porte', String(walkable(0,3,4)&&walkable(0,3,4).id), 'corridor', walkable(0,3,5), 'locked', walkable(0,10,4));
    heroMove(0,-1); log('vers la porte : hero', JSON.stringify(hero), 'busy', heroBusy);
    if (run){ clearInterval(timerIv); run=null; } hero.floor=-1; openMap(0); heroMove(1,0); heroMove(1,0); heroMove(0,1); log('couloir', JSON.stringify(hero));
    for (const k in MUSIC_TRACKS){ const E = MUSIC.events(MUSIC_TRACKS[k]); if (!E.ev.length) log('MUSIQUE vide', k); } log('musiques', Object.keys(MUSIC_TRACKS).length); toggleMusic(); log('musique coupée', S.music, $('#fab-music').textContent, MUSIC.timer); toggleMusic(); log('musique remise', S.music, $('#fab-music').textContent);
    // 3. écran salle réel : une question de chaque type rendue dans #stage
    window.setTimeout = _st;
    enterRoom(ROOM.formes); log('enterRoom OK, run =', !!run, 'stage html', $('#stage').innerHTML.length);
  }catch(e){ log('ERREUR', e.stack||e.message); }
  window.setTimeout = _st;
})();
</script></body></html>
