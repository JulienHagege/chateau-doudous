/* ---------- Acquis : faits de multiplication, tables, notions ----------
   Un fait a×b est « sûr » après 2 réussites de suite (s ≥ 2) ; b×a compte aussi. Une table est maîtrisée quand ses 10 faits sont sûrs.
   Ordre d'apprentissage des tables : 2, 10, 5, 3, 4, 6, 7, 8, 9. Les salles de tables, le donjon et l'orage piochent dans les tables
   maîtrisées + les deux suivantes (« en cours »), en privilégiant les faits jamais vus ou ratés. */
const TABLE_ORDER = [2,10,5,3,4,6,7,8,9];
const factKey = (a,b) => a+'x'+b;
function fact(a,b){ S.facts = S.facts || {}; return S.facts[factKey(a,b)] || (S.facts[factKey(a,b)] = {r:0,w:0,s:0}); }
function recordFact(a,b,ok){ [[a,b],[b,a]].forEach(([x,y],i) => { if (i===1 && x===y) return; const f = fact(x,y); if (ok){ f.r++; f.s++; } else { f.w++; f.s = 0; } f.t = Date.now(); }); }
const factMastered = (a,b) => ((S.facts||{})[factKey(a,b)]||{s:0}).s >= 2;
function tableProgress(n){ let m = 0, seen = 0; for (let b=1;b<=10;b++){ const f = (S.facts||{})[factKey(n,b)]; if (f && (f.r||f.w)) seen++; if (factMastered(n,b)) m++; } return {m, seen}; }
const tableMastered = n => tableProgress(n).m===10;
function activeTables(){ const done = TABLE_ORDER.filter(tableMastered), next = TABLE_ORDER.filter(n => !tableMastered(n)).slice(0,2); return [...done, ...next]; }
function pickFact(tables, bmax=10){
  const c = []; for (const a of tables) for (let b=1;b<=bmax;b++){ const f = (S.facts||{})[factKey(a,b)]; let w = !f ? 3 : (f.s===0 && f.w>0) ? 4 : f.s===1 ? 2.5 : f.s>=2 ? .4 : 1; if (b===1) w *= .25; c.push([a,b,w]); }
  if (!c.length) return [2,2]; const tot = c.reduce((s,x)=>s+x[2],0); let r = Math.random()*tot; for (const x of c){ r -= x[2]; if (r<=0) return [x[0],x[1]]; } return [c[0][0],c[0][1]];
}
function weakFacts(){ return Object.entries(S.facts||{}).filter(([k,f]) => f.w>0 && f.s<2).map(([k]) => k.split('x').map(Number)); }
function recordSkill(id, ok){ S.skills = S.skills || {}; const k = S.skills[id] || (S.skills[id] = {r:0,w:0}); if (ok) k.r++; else k.w++; }
function skillStatus(id){ const k = (S.skills||{})[id]; if (!k || !(k.r+k.w)) return 'new'; return (k.r+k.w>=16 && k.r/(k.r+k.w)>=.9) ? 'ok' : 'learning'; }
function weakRooms(){ return ROOMS.filter(r => !r.boss && skillStatus(r.id)==='learning' && (S.skills[r.id].w>0)); }
function checkTables(){ const now = TABLE_ORDER.filter(tableMastered); const fresh = now.filter(n => !(S.tablesDone||[]).includes(n)); if (fresh.length){ S.tablesDone = now; S.celebrateQueue = [...(S.celebrateQueue||[]), ...fresh]; } }

const summarize = st => ({ name:st.name||'', emblem:st.emblem||'vachou', updated:st.updated||0, billes:st.billes||0, cycle:st.cycle||0, freed:Object.values(st.rooms||{}).filter(r => r.found).length });
function savePlayers(){ lsSet(PKEY, P); }
function playerState(id){ const st = lsGet(pkey(id)); return st ? repairCounters(Object.assign(DEFAULT(), st)) : null; }
// Un bug (bonus de rapidité sans chrono, 2026-11-08) a pu mettre NaN, devenu null, dans les compteurs : on remet un nombre et on marque `repaired`, la synchro reprendra alors les billes du nuage si elles sont plus élevées
function repairCounters(st){ for (const k of ['billes','stars','storms','stormWins','sinceStorm','cycle']){ if (typeof st[k]!=='number' || !Number.isFinite(st[k])){ st[k] = 0; if (k==='billes') st.repaired = true; } } return st; }
function writeProfile(id, st){ lsSet(pkey(id), st); const e = P.list.find(p => p.id===id); const sum = Object.assign({id}, summarize(st)); if (e) Object.assign(e, sum); else P.list.push(sum); savePlayers(); }
function addPlayer(id, name, emblem, state){ const st = Object.assign(DEFAULT(), state||{}); st.name = name; st.emblem = emblem || st.emblem || 'vachou'; if (!st.updated) st.updated = Date.now(); writeProfile(id, st); return st; }

function loadPlayers(){ const p = lsGet(PKEY); if (p && Array.isArray(p.list)) P = Object.assign({list:[], current:null}, p);

  if (!P.list.length){ const old = lsGet(KEY); if (old && old.name){ addPlayer('legacy', old.name, old.emblem, old); P.current = 'legacy'; savePlayers(); } } }
function load(){ loadPlayers(); if (P.current && selectPlayer(P.current)) return; P.current = null; S = DEFAULT(); }
// Anciennes sauvegardes : found = salle terminée, level = prochain niveau à jouer (sans plafond)
function migrate(){
  // 2026-11-08 : la Salle du trésor (compléments à 100) devient la Salle de jeux (dés) ; on garde l'avancement de la salle
  if (S.rooms.complements100 && !S.rooms.des){ S.rooms.des = S.rooms.complements100; delete S.rooms.complements100; } if (S.skills && S.skills.complements100 && !S.skills.des){ S.skills.des = S.skills.complements100; delete S.skills.complements100; }
  // 2026-11-08 : un bug (bonus de rapidité sans chrono) a pu mettre NaN, devenu null, dans les compteurs ; on les remet à un nombre
  repairCounters(S);
  for (const id in S.rooms){ const rs = S.rooms[id]; if (rs.found==null) rs.found = rs.done>0; if (rs.level==null) rs.level = Math.min(3, (rs.done||0)+1); rs.level = Math.min(MAX_LEVEL, rs.level); } }

// Toute variation de billes ou d'étoiles passe ici : un montant non numérique est refusé et signalé (plus jamais de NaN dans la sauvegarde)
function addBilles(delta, where){ if (!Number.isFinite(delta)){ logErr(new Error('montant de billes invalide : ' + delta), where || 'billes'); return 0; } delta = Math.round(delta); if (!Number.isFinite(S.billes)) S.billes = 0; S.billes = Math.max(0, S.billes + delta); return delta; }
function addStars(n, where){ if (!Number.isFinite(n)){ logErr(new Error('étoiles invalides : ' + n), where || 'stars'); return 0; } if (!Number.isFinite(S.stars)) S.stars = 0; S.stars += n; return n; }

// Toutes les salles d'un étage sont ouvertes ; l'étage suivant s'ouvre quand tous ses doudous sont retrouvés (demande de Julien)
function roomUnlocked(r){
  if (S.unlockAll) return true;
  if (r.boss) return ROOMS.filter(x => !x.boss).every(x => isDone(x.id));
  return floorUnlocked(r.floor);
}
function floorUnlocked(f){ return S.unlockAll || f===0 || ROOMS.filter(r => r.floor===f-1).every(r => isDone(r.id)); }

let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state!=='running'){ try{ AC.resume(); }catch(e){} } return AC; }
['touchend','pointerdown','keydown'].forEach(ev => document.addEventListener(ev, () => { if (S.sound||S.music) ac(); }, {passive:true}));
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC) ac(); });
function tone(f, t0, dur, type='sine', vol=.18, dest){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, c.currentTime+t0);
  g.gain.setValueAtTime(0, c.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol, c.currentTime+t0+.01);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+t0+dur);
  o.connect(g).connect(dest||c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+.05);
}
function noise(dur, vol=.4, cutoff=600){
  const c = ac(); if(!c) return;
  const len = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.2);
  const src = c.createBufferSource(); src.buffer = buf; const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = cutoff;
  const g = c.createGain(); g.gain.value = vol; src.connect(f).connect(g).connect(c.destination); src.start();
}

// Chaque thème est un court motif ; le séquenceur en fait un vrai morceau : neuf sections (motif, aéré, octave, transposé,
// ralenti, respiration basse seule, à l'envers, à la quinte, reprise) dont l'ordre change à chaque passage. Une boucle dure
// plus d'une minute et ne se répète jamais à l'identique (demande de Julien : les boucles courtes étaient énervantes).
function seeded(n){ let x = (n*9301 + 49297) % 233280; return () => { x = (x*9301 + 49297) % 233280; return x/233280; }; }
const MUSIC = {
  cur:null, timer:null, gain:null, nextStart:0, cyc:0, T:null,
  variants(T, cyc){
    const m = T.melody, rnd = seeded(cyc*7+13);
    const sparse = m.map((x,i) => (i%2===1 && x[1]<=1 && rnd()<.6) ? [null, x[1]] : x);
    const retro = m.slice().reverse();
    const calm = m.map(x => [x[0], x[1]*2]);
    const A = {m, tr:0}, mid = [
      {m:sparse, tr:0, vol:.9}, {m, tr:12, vol:.75, lead:'triangle'}, {m, tr:5}, {m:calm, tr:0, vol:.8, lead:'sine', calm:true},
      {m:[], tr:0, breath:true}, {m:retro, tr:0}, {m, tr:7, vol:.9}
    ];
    for (let i=mid.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [mid[i],mid[j]] = [mid[j],mid[i]]; }
    return [A, ...mid, A];
  },
  events(T, cyc){
    const eighth = 30/T.bpm; const ev = []; let pos = 0; const baseLen = T.melody.reduce((s,x)=>s+x[1],0);
    for (const sec of this.variants(T, cyc||0)){
      const len = sec.breath ? baseLen : sec.m.reduce((s,x)=>s+x[1],0); const vol = T.vol*(sec.vol||1);
      let b = 0; for (const [n,d] of sec.m){ if (n!==null) ev.push({b:pos+b, d:d*.9, f:NOTE(n+sec.tr), type:sec.lead||T.lead, vol}); b += d; }
      b = 0; let i = 0; const bmul = sec.calm ? 2 : 1;
      while (b < len){ const [n,d] = T.bassl[i%T.bassl.length]; const dd = Math.min(d*bmul, len-b); if (n!==null) ev.push({b:pos+b, d:dd*.95, f:NOTE(n+sec.tr), type:T.bass, vol:T.vol*(sec.breath?1.1:.9)}); b += dd; i++; }
      if (T.perc && !sec.calm) for (let k=0;k<len;k++){ const ch = T.perc[k%T.perc.length]; if (ch==='x') ev.push({b:pos+k, d:.09, f:55, type:'sine', vol:T.vol*1.6}); else if (ch==='h') ev.push({b:pos+k, d:.03, f:3600+Math.random()*600, type:'square', vol:T.vol*.3}); }
      pos += len;
    }
    return {ev, M:pos, eighth};
  },
  play(name){
    if (this.cur===name && this.timer) return;
    this.stop(); this.cur = name; if (!S.music) return;
    const c = ac(); const T = MUSIC_TRACKS[name]; if (!c || !T) return;
    this.gain = c.createGain(); this.gain.gain.value = 1; this.gain.connect(c.destination);
    this.T = T; this.nextStart = c.currentTime + .05; this.cyc = Math.floor(Math.random()*1000); this.pending = null;
    this.timer = setInterval(() => this.tick(), 150); this.tick();
  },
  tick(){
    const c = ac(); if (!c || !this.gain || !this.T) return;
    // on programme les notes par tranches de 2 s d'avance (un cycle complet dure plus d'une minute)
    if (!this.pending){ this.pending = this.events(this.T, this.cyc); this.pending.start = this.nextStart; this.pending.i = 0; this.pending.ev.sort((x,y)=>x.b-y.b); }
    const P = this.pending; const horizon = c.currentTime + 2;
    while (P.i < P.ev.length && P.start + P.ev[P.i].b*P.eighth < horizon){ const e = P.ev[P.i++]; const at = P.start + e.b*P.eighth; if (at >= c.currentTime - .02) tone(e.f, at - c.currentTime, e.d*P.eighth, e.type, e.vol, this.gain); }
    if (P.i >= P.ev.length){ this.nextStart = P.start + P.M*P.eighth; this.cyc++; this.pending = null; }
  },
  stop(){ clearInterval(this.timer); this.timer = null; this.pending = null; if (this.gain){ try{ const g = this.gain; g.gain.setTargetAtTime(0, ac().currentTime, .06); setTimeout(()=>{ try{ g.disconnect(); }catch(e){} }, 500); }catch(e){} this.gain = null; } },
  refresh(){ const n = this.cur; this.stop(); this.cur = null; if (n && S.music) this.play(n); else this.cur = n; }
};

let toastT = null;
function toast(msg, ms=2600){ let t = $('.toast'); if (!t){ t = document.createElement('div'); t.className='toast'; document.body.appendChild(t); } t.textContent = fr(msg); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms); }
function sparkle(el, txt='✨'){ try{ const r = el.getBoundingClientRect(); for (let i=0;i<5;i++){ const s = document.createElement('span'); s.className='sparkle'; s.textContent = txt; s.style.left = (r.left + Math.random()*r.width) + 'px'; s.style.top = (r.top + r.height/2) + 'px'; s.style.position='fixed'; s.style.zIndex = 40; document.body.appendChild(s); setTimeout(()=>s.remove(), 900); } }catch(e){} }
function confetti(){
  const c = $('#confetti'); c.hidden = false; c.innerHTML = '';
  for (let i=0;i<60;i++){ const s = document.createElement('i'); const col = pick(['#ffd166','#ff8fb1','#8de3c0','#7cc4ff','#c9b6ff','#fff']);
    s.style.cssText = `position:absolute;left:${Math.random()*100}%;top:-10px;width:10px;height:14px;background:${col};transform:rotate(${Math.random()*360}deg);animation:fall ${2+Math.random()*2}s linear ${Math.random()*1.2}s forwards`; c.appendChild(s); }
  setTimeout(() => { c.hidden = true; c.innerHTML=''; }, 4500);
}
const st = document.createElement('style'); st.textContent = '@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}'; document.head.appendChild(st);
