let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state!=='running'){ try{ AC.resume(); }catch(e){} } return AC; }
['touchend','pointerdown','keydown'].forEach(ev => document.addEventListener(ev, () => { if (S.sound||S.music) ac(); }, {passive:true}));
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC) ac(); });
function tone(f, t0, dur, type='sine', vol=.18, dest){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, c.currentTime+t0);
  g.gain.setValueAtTime(0, c.currentTime+t0);
  g.gain.linearRampToValueAtTime(vol, c.currentTime+t0+.01);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+t0+dur);
  o.connect(g).connect(dest||c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+.05);
}
function noise(dur, vol=.4, cutoff=600){
  const c = ac(); if(!c) return;
  const len = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, 2.2);
  const src = c.createBufferSource(); src.buffer = buf; const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = cutoff;
  const g = c.createGain(); g.gain.value = vol; src.connect(f).connect(g).connect(c.destination); src.start();
}

/* ---------- Musiques : petit séquenceur, une boucle par ambiance ---------- */
// Notes en demi-tons depuis le la 440 (0 = la4). Chaque piste : {bpm, lead:[[note|null, durée en croches]...], bass:[...], type}
const NOTE = n => 440 * Math.pow(2, n/12);
const MUSIC_TRACKS = {
  home:  {bpm:92,  lead:'triangle', bass:'sine', vol:.07,
          melody:[[3,2],[7,2],[10,2],[7,2],[5,2],[3,2],[-2,4], [3,2],[7,2],[10,2],[12,2],[10,2],[7,2],[5,4]],
          bassl:[[-21,4],[-14,4],[-17,4],[-12,4],[-21,4],[-14,4],[-19,4],[-12,4]]},
  floor0:{bpm:104, lead:'square', bass:'triangle', vol:.05,
          melody:[[0,1],[4,1],[7,2],[4,1],[7,1],[12,2],[9,1],[7,1],[4,2],[5,1],[4,1],[2,2], [0,1],[4,1],[7,2],[12,2],[11,1],[9,1],[7,2],[5,2],[2,2],[0,4]],
          bassl:[[-24,4],[-17,4],[-19,4],[-12,4],[-24,4],[-17,4],[-19,4],[-24,4]]},
  floor1:{bpm:112, lead:'triangle', bass:'triangle', vol:.06,
          melody:[[2,1],[5,1],[9,1],[12,1],[9,2],[7,2],[5,1],[7,1],[9,1],[5,1],[2,4], [0,1],[2,1],[5,1],[9,1],[7,2],[5,2],[2,1],[0,1],[-3,1],[0,1],[2,4]],
          bassl:[[-22,4],[-15,4],[-17,4],[-10,4],[-22,4],[-15,4],[-19,4],[-22,4]]},
  floor2:{bpm:126, lead:'square', bass:'sawtooth', vol:.045,
          melody:[[-3,1],[0,1],[4,1],[7,1],[9,1],[7,1],[4,1],[0,1],[-1,1],[2,1],[5,1],[9,1],[11,1],[9,1],[5,1],[2,1], [-3,1],[0,1],[4,1],[7,1],[12,2],[11,1],[9,1],[7,2],[4,2],[0,4]],
          bassl:[[-27,2],[-27,2],[-20,2],[-20,2],[-25,2],[-25,2],[-18,2],[-18,2],[-27,2],[-27,2],[-20,2],[-20,2],[-22,2],[-22,2],[-27,4]]},
  tower: {bpm:96,  lead:'triangle', bass:'sawtooth', vol:.06,
          melody:[[0,3],[3,1],[7,2],[3,2],[2,3],[5,1],[8,2],[5,2],[0,3],[3,1],[7,2],[10,2],[12,4],[10,2],[7,2]],
          bassl:[[-24,4],[-21,4],[-22,4],[-19,4],[-24,4],[-21,4],[-17,4],[-12,4]]},
  storm: {bpm:140, lead:'sawtooth', bass:'sawtooth', vol:.045,
          melody:[[-3,1],[-3,1],[-2,1],[-3,1],[null,1],[-9,1],[-3,2],[-3,1],[-3,1],[-2,1],[-3,1],[null,1],[-5,1],[-7,2]],
          bassl:[[-27,2],[-27,2],[-26,2],[-27,2],[-27,2],[-27,2],[-29,2],[-31,2]]}
};
const MUSIC = {
  cur:null, timer:null, nextT:0, mi:0, bi:0, mbeat:0, bbeat:0, gain:null,
  play(name){
    if (this.cur===name && this.timer) return;
    this.stop(); if (!S.music) { this.cur = name; return; }
    const c = ac(); if (!c) { this.cur = name; return; }
    this.cur = name; this.gain = c.createGain(); this.gain.gain.value = 1; this.gain.connect(c.destination);
    this.mi = 0; this.bi = 0; this.mbeat = 0; this.bbeat = 0; this.nextT = c.currentTime + .05; this.t0 = this.nextT;
    this.timer = setInterval(() => this.tick(), 120);
    this.tick();
  },
  tick(){
    const c = ac(); const T = MUSIC_TRACKS[this.cur]; if (!c || !T || !this.gain) return;
    const eighth = 30 / T.bpm; // durée d'une croche
    while (this.t0 + this.mbeat*eighth < c.currentTime + .4){
      const [n, d] = T.melody[this.mi % T.melody.length];
      if (n!==null) tone(NOTE(n), Math.max(0, this.t0 + this.mbeat*eighth - c.currentTime), d*eighth*.9, T.lead, T.vol, this.gain);
      this.mbeat += d; this.mi++;
    }
    while (this.t0 + this.bbeat*eighth < c.currentTime + .4){
      const [n, d] = T.bassl[this.bi % T.bassl.length];
      if (n!==null) tone(NOTE(n), Math.max(0, this.t0 + this.bbeat*eighth - c.currentTime), d*eighth*.95, T.bass, T.vol*.9, this.gain);
      this.bbeat += d; this.bi++;
    }
  },
  stop(){ clearInterval(this.timer); this.timer = null; if (this.gain){ try{ const g = this.gain; g.gain.setTargetAtTime(0, ac().currentTime, .08); setTimeout(()=>{ try{ g.disconnect(); }catch(e){} }, 600); }catch(e){} this.gain = null; } },
  refresh(){ const n = this.cur; this.stop(); if (n && S.music) { this.cur = null; this.play(n); } else this.cur = n; }
};
