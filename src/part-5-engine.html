<script>
/* =========================================================
   MOTEUR DE SALLE : enchaîne les épreuves, chrono, cœurs, billes, étoiles
   ========================================================= */
let run = null, timerIv = null, lastRoom = null;
function startRoom(room){
  const rs = roomState(room.id); const level = room.rev ? 1 : Math.min(MAX_LEVEL, rs.level || 1);
  // 5 niveaux de contenu par salle ; le chrono se resserre un peu à chaque niveau
  run = { room:room.id, level, gen:level, tfactor:Math.pow(.92, level-1), i:0, n:room.n, errors:0, hearts:maxHearts(), billes:0, results:[], asked:0, retry:[], q:null, answered:false, t0:0 };
  lastRoom = room.rev ? lastRoom : room;
  MUSIC.play(MUSIC_TRACKS['room_'+room.id] ? 'room_'+room.id : (room.floor===3 ? 'tower' : 'floor'+room.floor));
  SFX.door();
  show('room'); renderRoomHead(); nextQuestion();
}
function renderRoomHead(){
  const room = ROOM[run.room], d = DD[room.dd]; const el = $('#room');
  el.style.setProperty('--acc', room.acc); el.style.setProperty('--room-bg', room.bg); el.style.setProperty('--room-img', `url(${IMG['bg_'+(room.rev ? 'boss' : room.id)] || IMG.castle})`);
  $('#result').style.setProperty('--room-img', `url(${IMG['bg_'+(room.rev ? 'boss' : room.id)] || IMG.castle})`); $('#result').style.setProperty('--acc', room.acc);
  $('#cage').classList.toggle('free', !!room.rev); $('#cage-img').src = room.rev ? IMG.hero : IMG[d.id]; $('#cage-img').alt = room.rev ? 'Révision' : d.name;
  $('#room-name').textContent = room.name; $('#room-skill').textContent = room.rev ? room.skill : `${room.skill} · ${d.name} se cache ici`;
  const lb = $('#room-level'); lb.classList.toggle('rev', !!room.rev); lb.querySelector('b').textContent = room.rev ? 'Révision' : 'Niveau ' + run.level; lb.querySelector('.dots').innerHTML = room.rev ? '' : Array.from({length:MAX_LEVEL}, (_,i) => `<i class="${i<run.level?'on':''}"></i>`).join('');
  renderHearts(); renderProgress(); $('#room-billes').textContent = run.billes;
}
function renderHearts(){ const h = $('#hearts'); h.innerHTML = ''; for (let i=0;i<maxHearts();i++){ const s = document.createElement('span'); if (i>=run.hearts) s.className='off'; h.appendChild(s); } }
function renderProgress(){ const p = $('#progress'); p.innerHTML = ''; for (let i=0;i<run.n;i++){ const s = document.createElement('i'); if (run.results[i]===true) s.className='ok'; else if (run.results[i]===false) s.className='ko'; else if (i===run.i) s.className='cur'; p.appendChild(s); } }
function nextQuestion(){
  if (!run || screen!=='room') return; // la salle a été quittée pendant le délai après la réponse
  if (run.i >= run.n){ return endRoom(true); }
  const room = ROOM[run.room];
  let q = run.retry.length && Math.random()<.5 && run.i>run.retry[0].at+1 ? run.retry.shift().q : null;
  if (!q){
    // jamais la même épreuve que les trois précédentes (Julien a eu trois fois la baignoire à 9 L)
    run.seen = run.seen || []; for (let k=0;k<12;k++){ q = (room.boss || room.rev) ? GAMES[room.id].gen(run.gen, run.i, run.n) : GAMES[room.id].gen(run.gen); const sig = q.prompt + '|' + q.show; if (!run.seen.includes(sig)){ run.seen.push(sig); break; } if (k===11) run.seen.push(sig); }
    if (run.seen.length>3) run.seen.shift();
  }
  run.q = q; run.answered = false; renderProgress(); renderQuestion(q);
  const floor = FLOORS[room.floor]; const t = (floor.timer && run.level>1) ? floor.timer * (q.timeMult||1) * run.tfactor : 0; startTimer(t); // jamais de chrono au niveau 1 d'une salle
}
function renderQuestion(q){
  const stage = $('#stage'); stage.innerHTML = ''; const fb = $('#stage .feedback'); if (fb) fb.remove();
  // Le calcul en très gros, l'histoire en petit au-dessus : elle n'a pas besoin de lire la phrase pour répondre
  const sp = q.story ? {story:q.story, calc:q.prompt} : splitPrompt(q.prompt);
  if (sp){ const st = document.createElement('p'); st.className='story-line'; st.innerHTML = fr(sp.story); stage.appendChild(st); }
  const p = document.createElement('p'); p.className = 'prompt' + (sp ? ' calc' : ''); p.innerHTML = fr(sp ? sp.calc : q.prompt); stage.appendChild(p);
  if (q.sub){ const s = document.createElement('p'); s.className='sub'; s.textContent = fr(q.sub); stage.appendChild(s); }
  const api = { done:false, answer:(ok, shown) => submit(ok, shown) };
  if (q.kind==='custom'){ const box = document.createElement('div'); stage.appendChild(box); q.render(box, api); return; }
  if (q.render){ const box = document.createElement('div'); box.className='custom'; stage.appendChild(box); q.render(box, api); }
  if (q.kind==='qcm'){
    const box = document.createElement('div'); box.className = 'opts' + (q.options.length===3 ? ' three' : q.options.length===2 ? ' two' : ''); stage.appendChild(box);
    q.options.forEach(o => { const b = document.createElement('button'); b.className='opt'; b.textContent = o; b.onclick = () => { if (run.answered) return; const ok = String(o)===String(q.answer); b.classList.add(ok?'ok':'ko'); if (!ok) box.querySelectorAll('.opt').forEach(x => { if (String(x.textContent)===String(q.answer)) x.classList.add('ok'); }); submit(ok); }; box.appendChild(b); });
  } else if (q.kind==='num'){
    const entry = document.createElement('div'); entry.className='entry'; entry.innerHTML = `<span class="val" id="val"></span>${q.suffix?'<span>'+q.suffix+'</span>':''}`; stage.appendChild(entry);
    const pad = document.createElement('div'); pad.className='pad'; stage.appendChild(pad); let val = '';
    const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','✔'];
    keys.forEach(k => { const b = document.createElement('button'); b.textContent = k; if (k==='✔') b.className='go'; if (k==='⌫') b.className='del';
      b.onclick = () => { if (run.answered) return; SFX.click(); if (k==='⌫') val = val.slice(0,-1); else if (k==='✔'){ if (val==='') return; const ok = Number(val)===q.answer; $('#val').style.borderBottomColor = ok ? '#8de3c0' : '#ff7a5c'; submit(ok); return; } else if (val.length<4) val += k; $('#val').textContent = val; }; pad.appendChild(b); });
    window.onkeydown = e => { if (screen!=='room' || run.answered) return; if (/^[0-9]$/.test(e.key)){ if (val.length<4) val += e.key; } else if (e.key==='Backspace') val = val.slice(0,-1); else if (e.key==='Enter'){ if (val==='') return; const ok = Number(val)===q.answer; submit(ok); return; } else return; $('#val').textContent = val; };
  }
}
// Après une erreur : même épreuve, sans chrono, avec la consigne « refais-la », jusqu'à la bonne réponse
function redoQuestion(){
  if (!run) return; run.redo = true; run.answered = false; clearInterval(timerIv); $('#timer').hidden = true;
  renderQuestion(run.q);
  const q = run.q; const b = document.createElement('div'); b.className = 'redo';
  b.innerHTML = `<div>🔁 Refais-la : la réponse est <b>${esc(q.show)}</b></div>` + (q.explain ? `<small>${fr(esc(q.explain))}</small>` : '') + (q.explainHtml || '') + (q.explainShape ? `<svg viewBox="0 0 120 120" class="exshape">${shapeSvg(q.explainShape, 60, 60, 36, '#ffd166', 0, '', q.explainShape)}</svg>` : '');
  $('#stage').appendChild(b); // en bas, comme le message d'erreur (demande de Julien)
}
function splitPrompt(pr){ const m = pr.match(/^(.+?[.!]) (.+)$/); if (!m) return null; const calc = m[2]; const plain = calc.replace(/<[^>]+>/g,''); if (/^[\d\s+−×÷=?€,cLm]+$/.test(plain) || /^(Le|La) <b>(double|moitié|triple|quart|quadruple)<\/b> de \d+ \?$/.test(calc)) return {story:m[1], calc}; return null; }
function startTimer(sec){
  clearInterval(timerIv); const t = $('#timer'), bar = $('#timer-bar');
  if (!sec){ t.hidden = true; return; }
  t.hidden = false; bar.style.width = '100%'; bar.classList.remove('low'); run.t0 = Date.now(); run.tlen = sec*1000; let lastTick = -1;
  timerIv = setInterval(() => {
    const left = run.tlen - (Date.now()-run.t0); const pct = clamp(left/run.tlen*100, 0, 100); bar.style.width = pct+'%';
    if (pct<30){ bar.classList.add('low'); const s = Math.ceil(left/1000); if (s!==lastTick && s<=3 && s>0){ lastTick = s; SFX.tick(); } }
    if (left<=0){ clearInterval(timerIv); submit(false, 'Trop tard ! La réponse était ' + run.q.show); }
  }, 100);
}
function submit(ok, shown){
  if (!run || run.answered) return; run.answered = true; clearInterval(timerIv);
  const room = ROOM[run.room], floor = FLOORS[room.floor]; const q = run.q;
  if (!run.redo) run.results[run.i] = ok; S.tot = S.tot || {r:0,w:0};
  if (!run.redo){ if (q.fact) recordFact(q.fact[0], q.fact[1], ok); recordSkill((room.boss || room.rev) ? (q.from || room.id) : room.id, ok); checkTables(); }
  const stage = $('#stage'); const fb = document.createElement('div'); fb.className = 'feedback ' + (ok?'ok':'ko');
  if (ok && run.redo){
    fb.innerHTML = pick(['C\'est ça !','Voilà !','Oui, c\'est bien ça !']) + ' <small>On continue</small>'; SFX.ok();
  } else if (ok){
    S.tot.r++; const gain = floor.billes + 3*(run.level-1) + (run.tlen>0 ? Math.round(clamp((run.tlen-(Date.now()-run.t0))/run.tlen,0,1)*5) : 0); // bonus de rapidité seulement s'il y a un chrono (sinon division par zéro = NaN)
    run.billes += gain; S.billes += gain; $('#room-billes').textContent = run.billes;
    fb.innerHTML = pick(['Bravo !','Super !','Oui !','Génial !','Exact !','Trop fort !']) + ` <small>+${gain} billes</small>`; SFX.ok(); setTimeout(SFX.bille, 150); sparkle($('#room-billes'), '✨');
  } else if (run.redo){
    // deuxième erreur sur la même épreuve : on remontre la réponse et on recommence, sans nouvelle pénalité
    SFX.ko(); fb.innerHTML = fr(shown || ('Regarde bien : la réponse est ' + q.show)) + ' <small>Essaie encore</small>';
    stage.appendChild(fb); setTimeout(() => redoQuestion(), 2000); return;
  } else {
    S.tot.w++; run.errors++; run.hearts--; renderHearts(); SFX.ko(); setTimeout(SFX.lose, 250);
    const loss = Math.min(S.billes, Math.ceil(floor.billes/2)); S.billes -= loss; run.billes -= loss; $('#room-billes').textContent = run.billes;
    fb.innerHTML = fr(shown || ('La réponse était ' + q.show)) + ` <small>${loss ? '−'+loss+' billes · ' : ''}Refais-la pour continuer</small>`;
    if (run.retry.length<3) run.retry.push({q, at:run.i});
    stage.appendChild(fb); renderProgress(); save();
    if (run.hearts<=0){ setTimeout(() => endRoom(false), 1500); return; }
    setTimeout(() => redoQuestion(), 2200); return;
  }
  stage.appendChild(fb); renderProgress(); save();
  if (run.redo){ run.redo = false; }
  run.i++;
  setTimeout(() => maybeCelebrate(nextQuestion), ok ? 900 : 2200);
}
function endRoom(won){
  if (!run) return; clearInterval(timerIv); window.onkeydown = null;
  const room = ROOM[run.room], d = room.rev ? {name:'Révision', desc:'', id:'hero'} : DD[room.dd], rs = roomState(room.id);
  const rewards = [];
  if (won){
    const first = !rs.found; rs.done++; if (!room.rev){ rs.found = true; rs.level = Math.min(MAX_LEVEL, (rs.level||1) + 1); } const bonus = room.boss ? 300 : 50; S.billes += bonus; run.billes += bonus; rewards.push(`<span class="rw" style="color:var(--bille)">${run.billes>=0?'+':''}${run.billes} billes</span>`);
    if (run.errors===0){ const st = room.boss ? 3 : 1; S.stars += st; rs.perfect++; rewards.push(`<span class="rw" style="color:var(--star)">⭐ ${st===1?'Une étoile : sans faute !':'Trois étoiles : sans faute !'}</span>`); }
    if (rs.best===null || run.errors<rs.best) rs.best = run.errors;
    S.sinceStorm = (S.sinceStorm||0) + 1;
    $('#cage').classList.add('free');
    $('#res-img').src = IMG[d.id]; $('#res-title').textContent = room.rev ? (run.errors===0 ? 'Révision parfaite !' : 'Révision terminée !') : first ? `Tu as retrouvé ${d.name} !` : `${d.name} est ravi${d.id==='vachou'?'e':''} !`;
    $('#res-text').textContent = room.rev ? `${run.errors===0 ? 'Tout est juste, bravo !' : run.errors+' erreur'+(run.errors>1?'s':'')+', regarde ton carnet pour voir ce qui reste à travailler.'}` : first ? `${d.name}, ${d.desc}, sort de sa cachette et saute dans tes bras. ${room.boss ? 'Tous les doudous sont réunis, le château est sauvé !' : 'Une nouvelle porte vient de s\'ouvrir sur la carte.'}` : `Niveau ${run.level} réussi. ${run.errors===0 ? 'Sans aucune faute !' : run.errors+' erreur'+(run.errors>1?'s':'')+', tu progresses !'}`;
    const prevH = maxHearts(); save(); if (maxHearts()>prevH){ rewards.push('<span class="rw" style="color:var(--heart)">❤️ Un cœur de plus !</span>'); setTimeout(SFX.heart, 1200); }
    SFX.freed(); confetti(); if (room.boss){ setTimeout(MUSIC.play.bind(MUSIC,'home'), 100); $('#btn-res-map').textContent = '🎉 Et maintenant ?'; $('#btn-res-again').hidden = true; } else { $('#btn-res-map').textContent = '🗺️ Retour à la carte'; $('#btn-res-again').hidden = false; }
  } else {
    rewards.push(`<span class="rw" style="color:var(--bille)">${run.billes>=0?'+':''}${run.billes} billes</span>`);
    $('#res-img').src = IMG[d.id]; $('#res-title').textContent = 'Plus de cœurs…'; $('#res-text').textContent = room.rev ? 'La révision s\'arrête là. Repose-toi et réessaie plus tard !' : `${d.name} t'attend encore dans ${room.name}. Repose-toi et réessaie, tu vas y arriver !`;
    SFX.fail(); save(); $('#btn-res-map').textContent = '🗺️ Retour à la carte'; $('#btn-res-again').hidden = false;
  }
  $('#res-rewards').innerHTML = rewards.join(''); $('#res-title').textContent = fr($('#res-title').textContent); $('#res-text').textContent = fr($('#res-text').textContent); show('result'); run = null;
}

/* =========================================================
   CARTE : plan d'étage vu du dessus, dessiné sur canvas, brouillard qui se lève
   ========================================================= */
let mapFloor = 0; const TILE = 32, MW = 20, MH = 12; let hero = {x:10, y:11, dir:'s', floor:-1};
const mapCv = $('#map'); const SPR = {};
function loadSprites(){ for (const k in IMG){ const im = new Image(); im.src = IMG[k]; SPR[k] = im; im.onload = () => { if (screen==='mapscreen') drawMap(); }; } }
function hash(x,y){ let h = (x*374761393 + y*668265263) ^ 0x5bd1e995; h = (h ^ (h>>13)) * 1274126177; return ((h ^ (h>>16)) >>> 0) / 4294967295; }
function floorLayout(f){
  const rooms = ROOMS.filter(r => r.floor===f);
  // couloir : barre horizontale rangées 5-6 (ou autour du donjon), escalier à droite, entrée en bas au centre
  const corr = f===3 ? [[1,8,18,2],[9,10,2,2]] : [[1,5,18,2],[9,7,2,4]];
  const stairs = f===3 ? null : [19,5,1,1];
  return {rooms, corr, stairs};
}
function revealed(f){
  // Salles visibles : terminées + la prochaine accessible (brouillard sur le reste)
  const L = floorLayout(f); const set = new Set();
  L.rooms.forEach(r => { if (isDone(r.id) || roomUnlocked(r)) set.add(r.id); }); // un étage ouvert est entièrement dévoilé
  return set;
}
/* ---------- Dessin de la carte : chaque salle est une fenêtre sur son décor, couloirs pavés avec tapis et torches ---------- */
let cobble = null; const SIL = {};
function cobbleTex(){
  if (cobble) return cobble; const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#2b2442'; g.fillRect(0,0,64,64);
  for (let y=0;y<4;y++) for (let x=0;x<4;x++){ const sh = .8+hash(x*5+y,y*3+x)*.35; g.fillStyle = `rgb(${Math.round(96*sh)},${Math.round(84*sh)},${Math.round(130*sh)})`; g.fillRect(x*16+1, y*16+1, 14, 14); g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(x*16+1, y*16+1, 14, 2); g.fillRect(x*16+1, y*16+1, 2, 14); g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(x*16+1, y*16+13, 14, 2); g.fillRect(x*16+13, y*16+1, 2, 14); }
  cobble = c; return c;
}
function silhouette(sp, key){ if (SIL[key]) return SIL[key]; const c = document.createElement('canvas'); c.width = sp.width; c.height = sp.height; const g = c.getContext('2d'); g.drawImage(sp,0,0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#0a0818'; g.fillRect(0,0,c.width,c.height); SIL[key] = c; return c; }
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function torch(g,x,y,t){ g.fillStyle='#5a3a1a'; g.fillRect(x-2,y+2,4,9); const fl = 3+Math.sin(t/120)*1.4; const gr = g.createRadialGradient(x,y,1,x,y,30); gr.addColorStop(0,'rgba(255,190,80,.5)'); gr.addColorStop(1,'rgba(255,190,80,0)'); g.fillStyle=gr; g.fillRect(x-30,y-30,60,60); g.fillStyle='#ff9a3c'; g.beginPath(); g.arc(x,y,fl,0,Math.PI*2); g.fill(); g.fillStyle='#fff0a0'; g.beginPath(); g.arc(x,y,fl*.5,0,Math.PI*2); g.fill(); }
// Badge « Niveau N » avec cinq points, bien visible en bas à droite de chaque salle
function levelBadge(g, r, px, py, pw, ph, done){
  const lvl = roomLevel(r.id); const bw = 52, bh = 20, bx = px+12, by = py+ph-bh-12;
  for (let i=0;i<MAX_LEVEL;i++){ g.fillStyle = i < lvl ? '#ffd166' : 'rgba(255,255,255,.25)'; g.fillRect(bx+2+i*10, by-9, 7, 5); }
  g.fillStyle = done ? '#ffd166' : 'rgba(10,8,25,.85)'; roundRect(g, bx, by, bw, bh, 7); g.fill(); g.strokeStyle = done ? '#8a6a1c' : 'rgba(255,209,102,.6)'; g.lineWidth = 2; g.stroke();
  g.font = 'bold 12px Fredoka, Nunito, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = done ? '#3a2a05' : '#ffd166'; g.fillText('Niv. ' + lvl, bx+bw/2, by+bh/2+1);
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
}
function drawMap(){
  const cv = mapCv; const W = MW*TILE, H = MH*TILE; cv.width = W; cv.height = H; const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  const f = mapFloor, L = floorLayout(f); const now = Date.now();
  // roche sombre
  g.fillStyle = '#0f0c20'; g.fillRect(0,0,W,H);
  for (let y=0;y<MH;y++) for (let x=0;x<MW;x++){ const v = hash(x,y); g.fillStyle = `rgba(70,58,110,${.08+v*.14})`; g.fillRect(x*TILE+3, y*TILE+3, TILE-6, TILE-6); }
  const pat = g.createPattern(cobbleTex(), 'repeat');
  // couloirs : pavés, tapis, murs, torches
  L.corr.forEach(([x,y,w,h]) => {
    g.fillStyle = pat; g.fillRect(x*TILE, y*TILE, w*TILE, h*TILE);
    const horiz = w>=h; g.fillStyle = '#7d2538';
    if (horiz) g.fillRect(x*TILE, (y+h/2)*TILE-11, w*TILE, 22); else g.fillRect((x+w/2)*TILE-11, y*TILE, 22, h*TILE);
    g.fillStyle = '#e0b84a'; if (horiz){ g.fillRect(x*TILE,(y+h/2)*TILE-11,w*TILE,2); g.fillRect(x*TILE,(y+h/2)*TILE+9,w*TILE,2); } else { g.fillRect((x+w/2)*TILE-11,y*TILE,2,h*TILE); g.fillRect((x+w/2)*TILE+9,y*TILE,2,h*TILE); }
    g.strokeStyle = '#1a1530'; g.lineWidth = 5; g.strokeRect(x*TILE+2, y*TILE+2, w*TILE-4, h*TILE-4);
    g.strokeStyle = 'rgba(255,255,255,.08)'; g.lineWidth = 2; g.strokeRect(x*TILE+6, y*TILE+6, w*TILE-12, h*TILE-12);
    if (horiz && w>4) for (let i=2;i<w;i+=4) torch(g, (x+i)*TILE, y*TILE+8, now+i*300);
  });
  // entrée
  { g.fillStyle = pat; g.fillRect(9*TILE, 11*TILE, 2*TILE, TILE); g.fillStyle='#1a1530'; g.fillRect(9*TILE+6, 11*TILE+8, 2*TILE-12, TILE-8); g.fillStyle='#7a4a1a'; roundRect(g, 9*TILE+10, 11*TILE+10, 2*TILE-20, TILE, 12); g.fill(); g.fillStyle='#ffd166'; g.fillRect(10*TILE-2, 11*TILE+20, 4, 4); g.font='bold 12px Nunito,sans-serif'; g.fillStyle='#fff'; g.textAlign='center'; g.fillText(f===0?'Entrée':'Escalier', 10*TILE, 11*TILE+5); }
  // salles : fenêtre sur le décor
  L.rooms.forEach(r => {
    const [x,y,w,h] = r.rect; const px = x*TILE, py = y*TILE, pw = w*TILE, ph = h*TILE; const done = isDone(r.id), open = roomUnlocked(r); const bg = SPR['bg_'+r.id];
    g.save(); g.beginPath(); g.rect(px+5, py+5, pw-10, ph-10); g.clip();
    if (bg && bg.complete){ const sc = Math.max((pw-10)/bg.width, (ph-10)/bg.height); const dw = bg.width*sc, dh = bg.height*sc; g.drawImage(bg, px+5+((pw-10)-dw)/2, py+5+((ph-10)-dh)/2, dw, dh); }
    else { g.fillStyle = r.bg; g.fillRect(px,py,pw,ph); }
    if (!done) { g.fillStyle = 'rgba(8,6,20,.5)'; g.fillRect(px,py,pw,ph); }
    if (!open) { g.fillStyle = 'rgba(8,6,20,.75)'; g.fillRect(px,py,pw,ph); }
    g.restore();
    g.strokeStyle = '#1a1530'; g.lineWidth = 10; g.strokeRect(px+5, py+5, pw-10, ph-10);
    g.strokeStyle = done ? r.acc : 'rgba(255,255,255,.35)'; g.lineWidth = 3; g.strokeRect(px+5, py+5, pw-10, ph-10);

  [2,3,4,5,6,7,8,9,10].forEach(n => {
    const pr = tableProgress(n); const st = tableMastered(n) ? 'ok' : pr.seen ? 'learning' : 'new'; const lab = st==='ok' ? '✅ maîtrisée' : st==='learning' ? `🔶 en cours · ${pr.m} / 10` : '⬜ à découvrir';
    const cells = Array.from({length:10}, (_,i) => { const b = i+1; const f = S.facts && S.facts[factKey(n,b)]; const c = factMastered(n,b) ? 'ok' : (f && f.w>0 && f.s===0) ? 'ko' : (f && (f.r||f.w)) ? 'mid' : ''; return `<i class="${c}" title="${n} × ${b} = ${n*b}">${b}</i>`; }).join('');
    const el = document.createElement('div'); el.className = 'tcard ' + st; el.innerHTML = `<b>Table de ${n}</b><span>${lab}</span><div class="facts">${cells}</div>`; tb.appendChild(el);
  });
  const sk = $('#carnet-skills'); sk.innerHTML = '';
  ROOMS.forEach(r => { const st = skillStatus(r.id); const k = S.skills && S.skills[r.id]; const lab = st==='ok' ? '✅ acquis' : st==='learning' ? '🔶 en cours' : '⬜ à découvrir';
    const el = document.createElement('div'); el.className = 'srow ' + st; el.innerHTML = `<img src="${IMG[r.dd]}" alt="" class="px"><div><b>${r.skill}</b><small>${r.name}${k ? ` · ${k.r} justes sur ${k.r+k.w}` : ''} · niveau ${roomLevel(r.id)}</small></div><span>${lab}</span>`; sk.appendChild(el); });
  const weak = weakRooms().length + weakFacts().length;
  $('#carnet-hint').textContent = fr(weak ? `${weakFacts().length} multiplication${weakFacts().length>1?'s':''} et ${weakRooms().length} notion${weakRooms().length>1?'s':''} à revoir.` : 'Rien à revoir pour le moment, tout est acquis !');
}

/* =========================================================
   SYNCHRO entre appareils (db claude.ai) : fusion par progression, jamais par date seule
   ========================================================= */
let DBCOL = null, LEGACY = null, DBREF = null, cloudTimer = null, cloudWriting = false, cloudDirty = false;
function setSync(state, text){ const c = $('#sync-chip'); if (!c) return; c.textContent = text; c.style.color = state==='ok' ? 'var(--mint)' : state==='err' ? 'var(--danger)' : 'var(--muted)'; }
function bindCloud(){ DBREF = (DBCOL && P.current) ? DBCOL.doc(P.current) : null; }
function adoptRemote(remote){ S = Object.assign(DEFAULT(), remote); migrate(); writeProfile(P.current, S); if (screen==='home') renderHome(); }
const prog = x => ((x.tot&&x.tot.r)||0) + ((x.tot&&x.tot.w)||0);
// Qui gagne entre deux versions d'un même joueur : une remise à zéro explicite, sinon la plus avancée, sinon la plus récente
function winner(local, remote){
  const remoteReset = (remote.resetAt||0) > (local.updated||0), localReset = (local.resetAt||0) > (remote.updated||0);
  if (remoteReset && !localReset) return 'remote'; if (localReset && !remoteReset) return 'local';
  if (prog(remote)!==prog(local)) return prog(remote)>prog(local) ? 'remote' : 'local';
  return (remote.updated||0)>=(local.updated||0) ? 'remote' : 'local';
}
async function pushProfile(id){ if (!DBCOL) return; const st = id===P.current ? S : playerState(id); if (!st) return; await DBCOL.doc(id).set({state:st, updated:st.updated||Date.now(), v:2}); }
// Fusionne un joueur distant avec sa version locale ; renvoie true si le local a changé
async function mergeProfile(id, remote){
  const local = playerState(id);
  if (!local){ addPlayer(id, remote.name||'Joueur', remote.emblem, remote); return true; }
  if (winner(local, remote)==='remote'){ if ((remote.updated||0)!==(local.updated||0) || prog(remote)!==prog(local)){ if (id===P.current) adoptRemote(remote); else writeProfile(id, Object.assign(DEFAULT(), remote)); return true; } return false; }
  await pushProfile(id); return false;
}
async function cloudPull(){
  if (!DBCOL) return false; const snap = await DBCOL.get(); const seen = new Set(); let changed = false;
  for (const d of snap.docs){ const data = d.data(); const remote = data && data.state; if (!remote) continue; seen.add(d.id); if (await mergeProfile(d.id, remote)) changed = true; }
  if (snap.empty && LEGACY){ // ancienne sauvegarde unique sur le compte : elle devient le joueur « legacy » (ou rejoint le joueur du même prénom)
    const ls = await LEGACY.get(); const data = ls.exists && ls.data(); const remote = data && data.state;
    if (remote && remote.name){ const match = P.list.find(p => p.id==='legacy') || P.list.find(p => (p.name||'').toLowerCase()===remote.name.toLowerCase()); const id = match ? match.id : 'legacy'; seen.add(id); if (await mergeProfile(id, remote)) changed = true; } }
  for (const p of P.list.slice()){ if (!seen.has(p.id)) await pushProfile(p.id); }
  if (changed && screen==='players') renderPlayers();
  return changed;
}
async function cloudFlush(){
  if (!DBREF || cloudWriting || !cloudDirty) return; cloudWriting = true; cloudDirty = false; const ref = DBREF, st = S;
  try{ await ref.set({state:st, updated:st.updated||Date.now(), v:2}); setSync('ok', '☁️ Synchronisé'); }
  catch(e){ if (e && (e.code==='invalid_argument' || e.code==='not_granted' || e.code==='revoked' || e.code==='quota_exceeded')){ DBCOL = null; DBREF = null; cloudDirty = false; setSync('off', '☁️ Sauvegarde locale'); } else { cloudDirty = true; setSync('err', '☁️ Synchro en attente'); } }
  finally{ cloudWriting = false; if (cloudDirty) setTimeout(cloudFlush, 2500); }
}
function cloudSave(){ if (!DBREF) return; cloudDirty = true; clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudFlush, 1500); }
async function initCloud(){
  if (!window.claude || typeof window.claude.use!=='function'){ settleBoot(); return; }
  try{ const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); if (!db || !user){ settleBoot(); return; }
    const id = await user.id(); if (!id){ settleBoot(); return; } DBCOL = db.collection('data/users/'+id+'/profiles/list'); LEGACY = db.doc('data/users/'+id+'/save'); // chemins : collection = nombre impair de segments, document = pair bindCloud();
    const changed = await cloudPull(); setSync('ok', '☁️ Synchronisé'); if (changed) toast('☁️ Joueurs récupérés depuis ton compte'); }
  catch(e){ console.warn('synchro', e); setSync('err', '☁️ Synchro indisponible'); }
  finally{ settleBoot(); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden){ cloudFlush(); } else if (DBCOL && !run && !storm){ cloudPull().catch(()=>{}); } });
addEventListener('pagehide', () => { cloudFlush(); });

   DÉMARRAGE
   ========================================================= */
function drawStars(){ const cv = $('#stars'); const g = cv.getContext('2d'); const W = cv.width = innerWidth, H = cv.height = innerHeight; g.clearRect(0,0,W,H); for (let i=0;i<120;i++){ g.fillStyle = `rgba(255,240,200,${.2+Math.random()*.6})`; const s = Math.random()<.15 ? 3 : 2; g.fillRect(Math.random()*W, Math.random()*H, s, s); } }
addEventListener('resize', drawStars); drawStars();
load(); loadSprites();
function boot(){ if (P.current && S.name){ renderHome(); show('home'); } else { renderPlayers(); show('players'); $('#players-sync').textContent = 'Recherche des joueurs sur ton compte…'; } }
let cloudSettled = false;
function settleBoot(){ if (cloudSettled) return; cloudSettled = true; $('#players-sync').textContent = ''; if (screen==='players') renderPlayers(); }
setTimeout(settleBoot, 8000);
(window.claude && window.claude.hot && window.claude.hot.ready) ? window.claude.hot.ready(boot) : boot();
initCloud();
document.addEventListener('pointerdown', function first(){ if (S.music && screen==='home') MUSIC.play('home'); document.removeEventListener('pointerdown', first); }, {once:true});
</script>
