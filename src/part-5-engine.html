<script>
/* =========================================================
   MOTEUR DE SALLE : enchaîne les épreuves, chrono, cœurs, billes, étoiles
   ========================================================= */
let run = null, timerIv = null;
function startRoom(room){
  const rs = roomState(room.id); const level = room.rev ? 1 : Math.min(MAX_LEVEL, rs.level || 1);
  // 5 niveaux de contenu par salle ; le chrono se resserre un peu à chaque niveau
  run = { room:room.id, level, gen:level, tfactor:Math.pow(.92, level-1), i:0, n:room.n, errors:0, hearts:maxHearts(), billes:0, results:[], asked:0, retry:[], q:null, answered:false, t0:0 };
  MUSIC.play(MUSIC_TRACKS['room_'+room.id] ? 'room_'+room.id : (room.floor===3 ? 'tower' : 'floor'+room.floor));
  SFX.door();
  show('room'); renderRoomHead(); nextQuestion();
}
function renderRoomHead(){
  const room = ROOM[run.room], d = DD[room.dd]; const el = $('#room');
  el.style.setProperty('--acc', room.acc); el.style.setProperty('--room-bg', room.bg); el.style.setProperty('--room-img', `url(${IMG['bg_'+(room.rev ? 'boss' : room.id)] || IMG.castle})`);
  $('#result').style.setProperty('--room-img', `url(${IMG['bg_'+(room.rev ? 'boss' : room.id)] || IMG.castle})`); $('#result').style.setProperty('--acc', room.acc);
  $('#cage').classList.toggle('free', !!room.rev); $('#cage-img').src = room.rev ? IMG.hero : IMG[d.id]; $('#cage-img').alt = room.rev ? 'Révision' : d.name;
  $('#room-name').textContent = room.name; $('#room-skill').textContent = room.rev ? room.skill : `${room.skill} · niveau ${run.level} · ${d.name} se cache ici`;
  renderHearts(); renderProgress(); $('#room-billes').textContent = run.billes;
}
function renderHearts(){ const h = $('#hearts'); h.innerHTML = ''; for (let i=0;i<maxHearts();i++){ const s = document.createElement('span'); if (i>=run.hearts) s.className='off'; h.appendChild(s); } }
function renderProgress(){ const p = $('#progress'); p.innerHTML = ''; for (let i=0;i<run.n;i++){ const s = document.createElement('i'); if (run.results[i]===true) s.className='ok'; else if (run.results[i]===false) s.className='ko'; else if (i===run.i) s.className='cur'; p.appendChild(s); } }
function nextQuestion(){
  if (run.i >= run.n){ return endRoom(true); }
  const room = ROOM[run.room];
  let q = run.retry.length && Math.random()<.5 && run.i>run.retry[0].at+1 ? run.retry.shift().q : null;
  if (!q){ q = (room.boss || room.rev) ? GAMES[room.id].gen(run.gen, run.i, run.n) : GAMES[room.id].gen(run.gen); }
  run.q = q; run.answered = false; renderProgress(); renderQuestion(q);
  const floor = FLOORS[room.floor]; const t = floor.timer ? floor.timer * (q.timeMult||1) * run.tfactor : 0; startTimer(t);
}
function renderQuestion(q){
  const stage = $('#stage'); stage.innerHTML = ''; const fb = $('#stage .feedback'); if (fb) fb.remove();
  const p = document.createElement('p'); p.className='prompt'; p.innerHTML = fr(q.prompt); stage.appendChild(p);
  if (q.sub){ const s = document.createElement('p'); s.className='sub'; s.textContent = fr(q.sub); stage.appendChild(s); }
  const api = { done:false, answer:(ok, shown) => submit(ok, shown) };
  if (q.kind==='custom'){ const box = document.createElement('div'); stage.appendChild(box); q.render(box, api); return; }
  if (q.render){ const box = document.createElement('div'); box.className='custom'; stage.appendChild(box); q.render(box, api); }
  if (q.kind==='qcm'){
    const box = document.createElement('div'); box.className = 'opts' + (q.options.length===3 ? ' three' : ''); stage.appendChild(box);
    q.options.forEach(o => { const b = document.createElement('button'); b.className='opt'; b.textContent = o; b.onclick = () => { if (run.answered) return; const ok = String(o)===String(q.answer); b.classList.add(ok?'ok':'ko'); if (!ok) box.querySelectorAll('.opt').forEach(x => { if (String(x.textContent)===String(q.answer)) x.classList.add('ok'); }); submit(ok); }; box.appendChild(b); });
  } else if (q.kind==='num'){
    const entry = document.createElement('div'); entry.className='entry'; entry.innerHTML = `<span class="val" id="val"></span>${q.suffix?'<span>'+q.suffix+'</span>':''}`; stage.appendChild(entry);
    const pad = document.createElement('div'); pad.className='pad'; stage.appendChild(pad); let val = '';
    const keys = ['1','2','3','4','5','6','7','8','9','⌫','0','✔'];
    keys.forEach(k => { const b = document.createElement('button'); b.textContent = k; if (k==='✔') b.className='go'; if (k==='⌫') b.className='del';
      b.onclick = () => { if (run.answered) return; SFX.click(); if (k==='⌫') val = val.slice(0,-1); else if (k==='✔'){ if (val==='') return; const ok = Number(val)===q.answer; $('#val').style.borderBottomColor = ok ? '#8de3c0' : '#ff7a5c'; submit(ok); return; } else if (val.length<4) val += k; $('#val').textContent = val; }; pad.appendChild(b); });
    window.onkeydown = e => { if (screen!=='room' || run.answered) return; if (/^[0-9]$/.test(e.key)){ if (val.length<4) val += e.key; } else if (e.key==='Backspace') val = val.slice(0,-1); else if (e.key==='Enter'){ if (val==='') return; const ok = Number(val)===q.answer; submit(ok); return; } else return; $('#val').textContent = val; };
  }
}
function startTimer(sec){
  clearInterval(timerIv); const t = $('#timer'), bar = $('#timer-bar');
  if (!sec){ t.hidden = true; return; }
  t.hidden = false; bar.style.width = '100%'; bar.classList.remove('low'); run.t0 = Date.now(); run.tlen = sec*1000; let lastTick = -1;
  timerIv = setInterval(() => {
    const left = run.tlen - (Date.now()-run.t0); const pct = clamp(left/run.tlen*100, 0, 100); bar.style.width = pct+'%';
    if (pct<30){ bar.classList.add('low'); const s = Math.ceil(left/1000); if (s!==lastTick && s<=3 && s>0){ lastTick = s; SFX.tick(); } }
    if (left<=0){ clearInterval(timerIv); submit(false, 'Trop tard ! La réponse était ' + run.q.show); }
  }, 100);
}
function submit(ok, shown){
  if (!run || run.answered) return; run.answered = true; clearInterval(timerIv);
  const room = ROOM[run.room], floor = FLOORS[room.floor]; const q = run.q;
  run.results[run.i] = ok; S.tot = S.tot || {r:0,w:0};
  if (q.fact) recordFact(q.fact[0], q.fact[1], ok); recordSkill((room.boss || room.rev) ? (q.from || room.id) : room.id, ok); checkTables();
  const stage = $('#stage'); const fb = document.createElement('div'); fb.className = 'feedback ' + (ok?'ok':'ko');
  if (ok){
    S.tot.r++; const gain = floor.billes + 3*(run.level-1) + (floor.timer ? Math.round(clamp((run.tlen-(Date.now()-run.t0))/run.tlen,0,1)*5) : 0);
    run.billes += gain; S.billes += gain; $('#room-billes').textContent = run.billes;
    fb.innerHTML = pick(['Bravo !','Super !','Oui !','Génial !','Exact !','Trop fort !']) + ` <small>+${gain} billes</small>`; SFX.ok(); setTimeout(SFX.bille, 150); sparkle($('#room-billes'), '✨');
  } else {
    S.tot.w++; run.errors++; run.hearts--; renderHearts(); SFX.ko(); setTimeout(SFX.lose, 250);
    const loss = Math.min(S.billes, Math.ceil(floor.billes/2)); S.billes -= loss; run.billes -= loss; $('#room-billes').textContent = run.billes;
    fb.innerHTML = fr(shown || ('La réponse était ' + q.show)) + ` <small>${loss ? '−'+loss+' billes · ' : ''}On la reverra tout à l\'heure</small>`;
    if (run.retry.length<3) run.retry.push({q, at:run.i});
  }
  stage.appendChild(fb); renderProgress(); save();
  if (!ok && run.hearts<=0){ setTimeout(() => endRoom(false), 1500); return; }
  run.i++;
  setTimeout(() => maybeCelebrate(nextQuestion), ok ? 900 : 2200);
}
function endRoom(won){
  clearInterval(timerIv); window.onkeydown = null;
  const room = ROOM[run.room], d = room.rev ? {name:'Révision', desc:'', id:'hero'} : DD[room.dd], rs = roomState(room.id);
  const rewards = [];
  if (won){
    const first = !rs.found; rs.done++; if (!room.rev){ rs.found = true; rs.level = Math.min(MAX_LEVEL, (rs.level||1) + 1); } const bonus = room.boss ? 300 : 50; S.billes += bonus; run.billes += bonus; rewards.push(`<span class="rw" style="color:var(--bille)">${run.billes>=0?'+':''}${run.billes} billes</span>`);
    if (run.errors===0){ const st = room.boss ? 3 : 1; S.stars += st; rs.perfect++; rewards.push(`<span class="rw" style="color:var(--star)">⭐ ${st===1?'Une étoile : sans faute !':'Trois étoiles : sans faute !'}</span>`); }
    if (rs.best===null || run.errors<rs.best) rs.best = run.errors;
    S.sinceStorm = (S.sinceStorm||0) + 1;
    $('#cage').classList.add('free');
    $('#res-img').src = IMG[d.id]; $('#res-title').textContent = room.rev ? (run.errors===0 ? 'Révision parfaite !' : 'Révision terminée !') : first ? `Tu as retrouvé ${d.name} !` : `${d.name} est ravi${d.id==='vachou'?'e':''} !`;
    $('#res-text').textContent = room.rev ? `${run.errors===0 ? 'Tout est juste, bravo !' : run.errors+' erreur'+(run.errors>1?'s':'')+', regarde ton carnet pour voir ce qui reste à travailler.'}` : first ? `${d.name}, ${d.desc}, sort de sa cachette et saute dans tes bras. ${room.boss ? 'Tous les doudous sont réunis, le château est sauvé !' : 'Une nouvelle porte vient de s\'ouvrir sur la carte.'}` : `Niveau ${run.level} réussi. ${run.errors===0 ? 'Sans aucune faute !' : run.errors+' erreur'+(run.errors>1?'s':'')+', tu progresses !'}`;
    const prevH = maxHearts(); save(); if (maxHearts()>prevH){ rewards.push('<span class="rw" style="color:var(--heart)">❤️ Un cœur de plus !</span>'); setTimeout(SFX.heart, 1200); }
    SFX.freed(); confetti(); if (room.boss){ setTimeout(MUSIC.play.bind(MUSIC,'home'), 100); $('#btn-res-map').textContent = '🎉 Et maintenant ?'; $('#btn-res-again').hidden = true; } else { $('#btn-res-map').textContent = '🗺️ Retour à la carte'; $('#btn-res-again').hidden = false; }
  } else {
    rewards.push(`<span class="rw" style="color:var(--bille)">${run.billes>=0?'+':''}${run.billes} billes</span>`);
    $('#res-img').src = IMG[d.id]; $('#res-title').textContent = 'Plus de cœurs…'; $('#res-text').textContent = room.rev ? 'La révision s\'arrête là. Repose-toi et réessaie plus tard !' : `${d.name} t'attend encore dans ${room.name}. Repose-toi et réessaie, tu vas y arriver !`;
    SFX.fail(); save(); $('#btn-res-map').textContent = '🗺️ Retour à la carte'; $('#btn-res-again').hidden = false;
  }
  $('#res-rewards').innerHTML = rewards.join(''); $('#res-title').textContent = fr($('#res-title').textContent); $('#res-text').textContent = fr($('#res-text').textContent); show('result'); run = null;
}

/* =========================================================
   CARTE : plan d'étage vu du dessus, dessiné sur canvas, brouillard qui se lève
   ========================================================= */
let mapFloor = 0; const TILE = 32, MW = 20, MH = 12; let hero = {x:10, y:11, dir:'s', floor:-1};
const mapCv = $('#map'); const SPR = {};
function loadSprites(){ for (const k in IMG){ const im = new Image(); im.src = IMG[k]; SPR[k] = im; im.onload = () => { if (screen==='mapscreen') drawMap(); }; } }
function hash(x,y){ let h = (x*374761393 + y*668265263) ^ 0x5bd1e995; h = (h ^ (h>>13)) * 1274126177; return ((h ^ (h>>16)) >>> 0) / 4294967295; }
function floorLayout(f){
  const rooms = ROOMS.filter(r => r.floor===f);
  // couloir : barre horizontale rangées 5-6 (ou autour du donjon), escalier à droite, entrée en bas au centre
  const corr = f===3 ? [[9,9,2,3]] : [[1,5,18,2],[9,7,2,4]];
  const stairs = f===3 ? null : [19,5,1,1];
  return {rooms, corr, stairs};
}
function revealed(f){
  // Salles visibles : terminées + la prochaine accessible (brouillard sur le reste)
  const L = floorLayout(f); const set = new Set();
  L.rooms.forEach(r => { if (isDone(r.id) || roomUnlocked(r)) set.add(r.id); }); // un étage ouvert est entièrement dévoilé
  return set;
}
function drawMap(){
  const cv = mapCv; const W = MW*TILE, H = MH*TILE; cv.width = W; cv.height = H; const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  const f = mapFloor, L = floorLayout(f), rev = revealed(f);
  // fond roche
  for (let y=0;y<MH;y++) for (let x=0;x<MW;x++){ g.fillStyle = hash(x,y)<.5 ? '#141127' : '#19152f'; g.fillRect(x*TILE,y*TILE,TILE,TILE); }
  const floorTile = (x,y,c1,c2) => { g.fillStyle = (x+y)%2 ? c1 : c2; g.fillRect(x*TILE,y*TILE,TILE,TILE); g.fillStyle='rgba(0,0,0,.08)'; g.fillRect(x*TILE+TILE-3,y*TILE,3,TILE); g.fillRect(x*TILE,y*TILE+TILE-3,TILE,3); };
  const drawRect = (rc, c1, c2, wall) => { const [x,y,w,h] = rc; for (let yy=y;yy<y+h;yy++) for (let xx=x;xx<x+w;xx++) floorTile(xx,yy,c1,c2); g.strokeStyle = wall; g.lineWidth = 6; g.strokeRect(x*TILE+3, y*TILE+3, w*TILE-6, h*TILE-6); g.fillStyle='rgba(255,255,255,.12)'; g.fillRect(x*TILE+6, y*TILE+6, w*TILE-12, 5); };
  // couloirs (révélés dès que l'étage est accessible)
  const anyRev = rev.size>0;
  if (anyRev){ L.corr.forEach(c => drawRect(c, '#4a4068', '#3f3660', '#2a2340')); }
  // salles
  L.rooms.forEach(r => {
    const done = isDone(r.id), open = roomUnlocked(r), vis = rev.has(r.id);
    const [x,y,w,h] = r.rect;
    if (!vis) return;
    const c1 = done ? '#6b5a8a' : open ? '#5a4a7a' : '#3a3250', c2 = done ? '#5f4f7e' : open ? '#4f4070' : '#332c48';
    drawRect(r.rect, c1, c2, r.acc);
    // meubles symboliques par salle (petits pixels colorés)
    g.fillStyle = r.acc; g.globalAlpha = .55; for (let i=0;i<3;i++){ const fx = x+1+Math.floor(hash(i,x)*(w-2)), fy = y+1+Math.floor(hash(x,i)*(h-2)); g.fillRect(fx*TILE+8, fy*TILE+8, 16, 16); } g.globalAlpha = 1;
    // porte
    const [dx,dy] = r.door; const inside = dy>=y && dy<y+h; const doorY = inside ? (dy+1)*TILE-10 : dy*TILE+TILE-8; g.fillStyle = '#7a4a1a'; g.fillRect(dx*TILE+6, doorY, TILE-12, 14); g.fillStyle = '#ffd166'; g.fillRect(dx*TILE+TILE-12, doorY+5, 3, 3); if (!inside){ g.fillStyle = '#3f3660'; g.fillRect(dx*TILE+4, dy*TILE+2, TILE-8, TILE-10); }
    // nom + doudou
    g.font = 'bold 13px Fredoka, Nunito, sans-serif'; g.fillStyle = '#fff'; g.textAlign = 'center'; g.fillText(r.name, (x+w/2)*TILE, y*TILE+22);
    const sp = SPR[r.dd]; const cx = (x+w/2)*TILE, cy = (y+h/2)*TILE+6;
    if (sp && sp.complete){ if (done){ g.drawImage(sp, cx-28, cy-24, 56, 56); } else { g.globalAlpha = .35; g.filter = 'brightness(0)'; g.drawImage(sp, cx-28, cy-24, 56, 56); g.filter = 'none'; g.globalAlpha = 1; g.font='bold 22px Fredoka, sans-serif'; g.fillStyle='#ffd166'; g.fillText('?', cx, cy+10); } }
    if (done){ g.font='14px sans-serif'; g.fillStyle='#ffe066'; const st = roomState(r.id); g.fillText('⭐'.repeat(Math.min(3, st.perfect)) || '✔', (x+w/2)*TILE, (y+h)*TILE-10); }
    if (open && !done){ const t = (Date.now()/400)%2; g.strokeStyle = `rgba(255,209,102,${.5+.4*Math.sin(t*Math.PI)})`; g.lineWidth = 4; g.strokeRect(x*TILE+1, y*TILE+1, w*TILE-2, h*TILE-2); g.font='22px sans-serif'; g.fillText('✨', (x+w/2)*TILE+40, y*TILE+26); }
  });
  // escalier
  if (L.stairs){ const [sx,sy] = L.stairs; const up = floorUnlocked(f+1); g.fillStyle = up ? '#ffd166' : '#3a3250'; for (let i=0;i<4;i++) g.fillRect(sx*TILE+4, sy*TILE+4+i*7, TILE-8-i*5, 5); if (up){ g.font='bold 12px Nunito,sans-serif'; g.fillStyle='#ffd166'; g.textAlign='center'; g.fillText('↑', sx*TILE+16, sy*TILE+54); } }
  // entrée
  if (f<3){ g.fillStyle='#7a4a1a'; g.fillRect(9*TILE+4, 11*TILE+10, 2*TILE-8, 18); g.font='bold 12px Nunito,sans-serif'; g.fillStyle='#fff'; g.textAlign='center'; g.fillText(f===0?'Entrée':'Escalier', 10*TILE, 11*TILE+4); }
  // héroïne : là où elle marche (clavier, pavé ou placement automatique)
  const heroSp = SPR['hero'+(hero.dir==='s'?'':'_'+hero.dir)] || SPR.hero;
  const hx = hero.x*TILE+16, hy = hero.y*TILE+16;
  if (heroSp && heroSp.complete){ const bob = Math.sin(Date.now()/300)*2; g.drawImage(heroSp, hx-24, hy-30+bob, 48, 48); }
  // doudous libérés suivent l'héroïne (petite file)
  const freed = ROOMS.filter(r => isDone(r.id)).slice(-4);
  freed.forEach((r, i) => { const sp = SPR[r.dd]; if (sp && sp.complete){ g.drawImage(sp, hx+10+i*18, hy-10+Math.sin(Date.now()/300+i)*2, 26, 26); } });
  // brouillard : voile + nuages sur les cases non révélées
  for (let y=0;y<MH;y++) for (let x=0;x<MW;x++){
    const inRev = L.rooms.some(r => rev.has(r.id) && x>=r.rect[0]-0 && x<r.rect[0]+r.rect[2] && y>=r.rect[1] && y<r.rect[1]+r.rect[3]) || (anyRev && L.corr.some(c => x>=c[0] && x<c[0]+c[2] && y>=c[1] && y<c[1]+c[3])) || (L.stairs && anyRev && x===L.stairs[0] && y===L.stairs[1]) || (f<3 && y===11 && (x===9||x===10)) || L.rooms.some(r => rev.has(r.id) && r.door[0]===x && r.door[1]===y);
    if (!inRev){ g.fillStyle = `rgba(20,16,40,${.55+hash(x,y)*.3})`; g.fillRect(x*TILE,y*TILE,TILE,TILE); g.fillStyle = 'rgba(120,110,160,.12)'; g.beginPath(); g.arc(x*TILE+16+hash(y,x)*10, y*TILE+16, 12+hash(x,y)*8, 0, Math.PI*2); g.fill(); }
  }
}
function heroStart(f){
  const L = floorLayout(f); const cur = L.rooms.find(r => !isDone(r.id) && roomUnlocked(r));
  if (cur){ const below = cur.door[1] > cur.rect[1]; return {x:cur.door[0], y:cur.door[1] + (below ? 1 : -1), dir: below ? 'n' : 's'}; }
  if (L.rooms.every(r => isDone(r.id)) && L.stairs) return {x:L.stairs[0]-1, y:L.stairs[1], dir:'e'};
  return {x:10, y:11, dir:'n'};
}
function walkable(f, x, y){
  if (x<0||y<0||x>=MW||y>=MH) return false; const L = floorLayout(f); const rev = revealed(f);
  const room = L.rooms.find(r => r.door[0]===x && r.door[1]===y);
  if (room) return rev.has(room.id) ? room : 'locked';
  if (L.corr.some(c => x>=c[0] && x<c[0]+c[2] && y>=c[1] && y<c[1]+c[3])) return true;
  if (L.stairs && x===L.stairs[0] && y===L.stairs[1]) return true;
  if (f<3 && y===11 && (x===9||x===10)) return true;
  return false;
}
function heroMove(dx, dy){
  if (screen!=='mapscreen' || heroBusy) return; const nx = hero.x+dx, ny = hero.y+dy; hero.dir = dx>0?'e':dx<0?'w':dy<0?'n':'s';
  const w = walkable(mapFloor, nx, ny);
  if (w==='locked'){ SFX.ko(); toast('Retrouve tous les autres doudous avant de monter voir Vachou !'); return; }
  if (!w){ SFX.click(); return; }
  hero.x = nx; hero.y = ny; SFX.tick();
  const L = floorLayout(mapFloor);
  if (L.stairs && nx===L.stairs[0] && ny===L.stairs[1]){ if (floorUnlocked(mapFloor+1)){ heroBusy = true; SFX.stairs(); setTimeout(() => { heroBusy = false; openMap(mapFloor+1); }, 350); } else toast('L\'escalier est fermé. Retrouve tous les doudous de cet étage !'); return; }
  if (typeof w==='object'){ heroBusy = true; setTimeout(() => { heroBusy = false; if (screen==='mapscreen') enterRoom(w); }, 300); }
}
let heroBusy = false;
document.addEventListener('keydown', e => {
  if (screen!=='mapscreen' || e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase(); const map = {arrowup:[0,-1], arrowdown:[0,1], arrowleft:[-1,0], arrowright:[1,0], z:[0,-1], w:[0,-1], s:[0,1], q:[-1,0], a:[-1,0], d:[1,0]};
  if (map[k]){ e.preventDefault(); heroMove(...map[k]); }
});
$('#dpad').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const [dx,dy] = b.dataset.d.split(',').map(Number); heroMove(dx,dy); });
let mapAnim = null;
function mapLoop(){ if (screen!=='mapscreen'){ mapAnim = null; return; } drawMap(); mapAnim = requestAnimationFrame(mapLoop); }
function openMap(f){
  if (f==null){ const cur = currentRoom(); f = cur ? cur.floor : 3; }
  if (hero.floor!==f){ hero = Object.assign(heroStart(f), {floor:f}); }
  mapFloor = f; $('#map-title').textContent = FLOORS[f].name;
  const fl = $('#floors'); fl.innerHTML = ''; FLOORS.forEach((F, i) => { const b = document.createElement('button'); b.textContent = F.short; b.disabled = !floorUnlocked(i); b.setAttribute('aria-current', i===f); b.onclick = () => { SFX.click(); openMap(i); }; fl.appendChild(b); });
  const cur = ROOMS.find(r => r.floor===f && !isDone(r.id) && roomUnlocked(r));
  const left = ROOMS.filter(r => r.floor===f && !isDone(r.id)).length;
  $('#maphint').textContent = fr(left ? (f===3 ? `✨ Vachou se cache au sommet. ${FLOORS[f].intro}` : `✨ ${left} doudou${left>1?'s':''} à retrouver à cet étage, dans l'ordre que tu veux. ${FLOORS[f].intro}`) : (floorUnlocked(f+1) ? 'Étage terminé ! Prends l\'escalier en haut à droite.' : 'Touche une salle pour la rejouer.'));
  MUSIC.play(f===3 ? 'tower' : 'floor'+f);
  show('mapscreen'); if (!mapAnim) mapLoop();
}

    {scene:`<div class="rules"><span>✔ Bonne réponse = des <b style="color:var(--bille)">billes</b></span><span>⭐ Salle sans faute = une <b style="color:var(--star)">étoile</b></span><span>❤️ 4 étoiles = un <b style="color:var(--heart)">cœur</b> en plus</span><span>❌ Une erreur = un cœur perdu, mais on réessaie !</span></div>`, text:`Prête ? Les doudous comptent sur toi. Entre dans le château !`, last:true}
  ];
}
function startIntro(after){ intro = {i:0, after, panels:introPanels()}; show('intro'); MUSIC.play('home'); renderIntro(); }
function renderIntro(){
  const P = intro.panels[intro.i]; $('#intro-scene').innerHTML = P.scene; $('#intro-text').textContent = fr(P.text);
  $('#intro-dots').innerHTML = intro.panels.map((_, k) => `<i class="${k===intro.i?'on':''}"></i>`).join('');
  $('#btn-intro-next').textContent = P.last ? '🏰 Entrer dans le château' : 'Suivant ▶'; $('#btn-intro-skip').hidden = !!P.last;
  if (P.fx==='storm'){ setTimeout(() => { const f = $('#intro-flash'); if (!f) return; f.style.transition='none'; f.style.opacity = .9; setTimeout(() => { f.style.transition='opacity .6s'; f.style.opacity = 0; }, 90); SFX.thunder(); const row = $('#intro-row'); if (row) setTimeout(() => row.classList.add('flee'), 500); }, 900); }
  if (P.fx==='door') SFX.door();
  if (P.fx==='pumpkin') setTimeout(SFX.pumpkin, 300);
}
function introStep(d){ if (!intro) return; if (intro.panels[intro.i].last) return endIntro(); intro.i = clamp(intro.i+d, 0, intro.panels.length-1); renderIntro(); }
function endIntro(){ if (!intro) return; S.introSeen = true; save(); const after = intro.after; intro = null; SFX.stairs(); after(); }

$('#btn-reset').onclick = () => { if (!resetArmed){ resetArmed = true; $('#btn-reset').textContent = 'Sûr ? Touche encore'; setTimeout(() => { resetArmed = false; $('#btn-reset').textContent = 'Tout effacer'; }, 4000); return; } const name = S.name; S = DEFAULT(); S.name = name; S.resetAt = Date.now(); save(); renderHome(); toast('Progression effacée'); resetArmed = false; $('#btn-reset').textContent = 'Tout effacer'; };

/* =========================================================
   NOUVEAU CYCLE : Vachou retrouvée, les doudous repartent se cacher, chaque salle monte d'un niveau
   ========================================================= */
let cyc = null;
function startCycle(){
  const all = DOUDOUS.map((d,i) => `<img src="${IMG[d.id]}" alt="${d.name}" class="px" style="animation-delay:${(i*.13).toFixed(2)}s">`).join('');
  const before = Object.fromEntries(ROOMS.map(r => [r.id, playedLevel(r.id)]));
  cyc = { i:0, panels:[
    {scene:`<img class="bg px" src="${IMG.castle}" alt=""><div class="night"></div><div class="row">${all}</div>`, text:`Tous les doudous sont réunis ! Mais ils adorent jouer à cache-cache…`, fx:'party'},
    {scene:`<img class="bg px" src="${IMG.castle}" alt="" style="filter:brightness(.6)"><div class="row flee">${all}</div>`, text:`Hop ! Un par un, ils repartent se cacher dans le château.`, fx:'flee'},
    {scene:`<div class="lvlgrid">${ROOMS.map((r,i) => `<span class="lvl" style="animation-delay:${(i*.12).toFixed(2)}s; --acc:${r.acc}"><b>${DD[r.dd].name}</b><i>${before[r.id]} ➜ <em>${roomLevel(r.id)}</em></i></span>`).join('')}</div>`, text:`Le château monte de niveau ! Chaque salle est un peu plus difficile qu'avant.`, fx:'levelup', last:true}
  ]};
  S.cycle = (S.cycle||0) + 1; ROOMS.forEach(r => { roomState(r.id).found = false; }); S.sinceStorm = 0; save();
  show('cycle'); MUSIC.play('home'); renderCycle();
}
function renderCycle(){
  const P = cyc.panels[cyc.i]; $('#cycle-scene').innerHTML = P.scene; $('#cycle-text').textContent = fr(P.text);
  $('#cycle-dots').innerHTML = cyc.panels.map((_, k) => `<i class="${k===cyc.i?'on':''}"></i>`).join('');
  $('#btn-cycle-next').textContent = P.last ? '🏰 Repartir à l’aventure' : 'Suivant ▶';
  if (P.fx==='party'){ SFX.freed(); confetti(); }
  if (P.fx==='flee'){ DOUDOUS.forEach((d,i) => setTimeout(SFX.bubble, 300 + i*130)); }
  if (P.fx==='levelup'){ ROOMS.forEach((r,i) => setTimeout(() => tone(880 + i*60, 0, .12, 'triangle', .08), 200 + i*120)); setTimeout(SFX.heart, 2300); }
}
$('#btn-cycle-next').onclick = () => { SFX.click(); if (cyc.panels[cyc.i].last){ cyc = null; hero.floor = -1; openMap(0); return; } cyc.i++; renderCycle(); };

/* =========================================================
   CÉLÉBRATION d'une table maîtrisée (file d'attente, affichée entre deux épreuves)
   ========================================================= */
let celebrateThen = null;
function maybeCelebrate(then){
  const q = S.celebrateQueue || [];
  if (!q.length){ if (then) then(); return; }
  const n = q.shift(); S.billes += 100; S.stars += 1; save(); celebrateThen = then;
  $('#celebrate-title').textContent = fr(`🎉 Table de ${n} maîtrisée !`);
  $('#celebrate-text').textContent = fr(`Tu connais maintenant toute la table de ${n}, du ${n} × 1 au ${n} × 10. Les doudous sont fiers de toi !`);
  const done = TABLE_ORDER.filter(tableMastered).length; const next = TABLE_ORDER.find(t => !tableMastered(t));
  $('#celebrate-next').textContent = fr(next ? `${done} table${done>1?'s':''} sur 9. Prochaine à apprendre : la table de ${next}.` : 'Les 9 tables sont maîtrisées. Championne !');
  $('#celebrate-parade').innerHTML = ROOMS.filter(r => everDone(r.id)).slice(0,8).map(r => `<img src="${IMG[r.dd]}" alt="" class="px">`).join('');
  $('#celebrate').hidden = false; confetti(); SFX.freed(); setTimeout(SFX.heart, 900); if (maxHearts() > (celebrateHeartsBefore||0)) {} 
}
let celebrateHeartsBefore = 0;

/* =========================================================
   CARNET : tables, notions, révision
   ========================================================= */
function renderCarnet(){
  const tb = $('#carnet-tables'); tb.innerHTML = '';
  [2,3,4,5,6,7,8,9,10].forEach(n => {
    const pr = tableProgress(n); const st = tableMastered(n) ? 'ok' : pr.seen ? 'learning' : 'new'; const lab = st==='ok' ? '✅ maîtrisée' : st==='learning' ? `🔶 en cours · ${pr.m} / 10` : '⬜ à découvrir';
    const cells = Array.from({length:10}, (_,i) => { const b = i+1; const f = S.facts && S.facts[factKey(n,b)]; const c = factMastered(n,b) ? 'ok' : (f && f.w>0 && f.s===0) ? 'ko' : (f && (f.r||f.w)) ? 'mid' : ''; return `<i class="${c}" title="${n} × ${b} = ${n*b}">${b}</i>`; }).join('');
    const el = document.createElement('div'); el.className = 'tcard ' + st; el.innerHTML = `<b>Table de ${n}</b><span>${lab}</span><div class="facts">${cells}</div>`; tb.appendChild(el);
  });
  const sk = $('#carnet-skills'); sk.innerHTML = '';
  ROOMS.forEach(r => { const st = skillStatus(r.id); const k = S.skills && S.skills[r.id]; const lab = st==='ok' ? '✅ acquis' : st==='learning' ? '🔶 en cours' : '⬜ à découvrir';
    const el = document.createElement('div'); el.className = 'srow ' + st; el.innerHTML = `<img src="${IMG[r.dd]}" alt="" class="px"><div><b>${r.skill}</b><small>${r.name}${k ? ` · ${k.r} justes sur ${k.r+k.w}` : ''} · niveau ${roomLevel(r.id)}</small></div><span>${lab}</span>`; sk.appendChild(el); });
  const weak = weakRooms().length + weakFacts().length;
  $('#carnet-hint').textContent = fr(weak ? `${weakFacts().length} multiplication${weakFacts().length>1?'s':''} et ${weakRooms().length} notion${weakRooms().length>1?'s':''} à revoir.` : 'Rien à revoir pour le moment, tout est acquis !');
}

/* =========================================================
   SYNCHRO entre appareils (db claude.ai) : fusion par progression, jamais par date seule
   ========================================================= */
let DBREF = null, cloudTimer = null, cloudWriting = false, cloudDirty = false;
function setSync(state, text){ const c = $('#sync-chip'); if (!c) return; c.textContent = text; c.style.color = state==='ok' ? 'var(--mint)' : state==='err' ? 'var(--danger)' : 'var(--muted)'; }
function adoptRemote(remote){ const name = S.name; S = Object.assign(DEFAULT(), remote); if (!S.name) S.name = name; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} if (S.name) $('#modal-name').hidden = true; if (screen==='home') renderHome(); }
const prog = x => ((x.tot&&x.tot.r)||0) + ((x.tot&&x.tot.w)||0);
async function cloudPull(){
  if (!DBREF) return; const snap = await DBREF.get();
  if (snap.exists){ const remote = snap.data().state; if (remote){
    const remoteReset = (remote.resetAt||0) > (S.updated||0), localReset = (S.resetAt||0) > (remote.updated||0); let winner;
    if (remoteReset && !localReset) winner = 'remote'; else if (localReset && !remoteReset) winner = 'local';
    else if (prog(remote)!==prog(S)) winner = prog(remote)>prog(S) ? 'remote' : 'local'; else winner = (remote.updated||0)>=(S.updated||0) ? 'remote' : 'local';
    if (winner==='remote'){ if ((remote.updated||0)!==(S.updated||0) || prog(remote)!==prog(S)){ adoptRemote(remote); return 'pulled'; } return 'same'; }
    cloudDirty = true; await cloudFlush(); return 'pushed'; } }
  cloudDirty = true; await cloudFlush(); return 'created';
}
async function cloudFlush(){
  if (!DBREF || cloudWriting || !cloudDirty) return; cloudWriting = true; cloudDirty = false;
  try{ await DBREF.set({state:S, updated:S.updated||Date.now(), v:1}); setSync('ok', '☁️ Synchronisé'); }
  catch(e){ if (e && (e.code==='invalid_argument' || e.code==='not_granted' || e.code==='revoked' || e.code==='quota_exceeded')){ DBREF = null; cloudDirty = false; setSync('off', '☁️ Sauvegarde locale'); } else { cloudDirty = true; setSync('err', '☁️ Synchro en attente'); } }
  finally{ cloudWriting = false; if (cloudDirty) setTimeout(cloudFlush, 2500); }
}
function cloudSave(){ if (!DBREF) return; cloudDirty = true; clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudFlush, 1500); }
async function initCloud(){
  if (!window.claude || typeof window.claude.use!=='function'){ settleModal(); return; }
  try{ const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); if (!db || !user){ settleModal(); return; }
    const id = await user.id(); if (!id){ settleModal(); return; } DBREF = db.doc('data/users/'+id+'/save');
    const r = await cloudPull(); setSync('ok', '☁️ Synchronisé'); if (r==='pulled') toast('☁️ Progression récupérée depuis ton autre appareil'); }
  catch(e){ console.warn('synchro', e); setSync('err', '☁️ Synchro indisponible'); }
  finally{ settleModal(); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden){ cloudFlush(); } else if (DBREF && !run && !storm){ cloudPull().catch(()=>{}); } });
addEventListener('pagehide', () => { cloudFlush(); });

function drawStars(){ const cv = $('#stars'); const g = cv.getContext('2d'); const W = cv.width = innerWidth, H = cv.height = innerHeight; g.clearRect(0,0,W,H); for (let i=0;i<120;i++){ g.fillStyle = `rgba(255,240,200,${.2+Math.random()*.6})`; const s = Math.random()<.15 ? 3 : 2; g.fillRect(Math.random()*W, Math.random()*H, s, s); } }
addEventListener('resize', drawStars); drawStars();
load(); loadSprites();

function settleModal(){ if (cloudSettled) return; cloudSettled = true; if (S.name){ $('#modal-name').hidden = true; return; } $('#modal-msg').textContent = 'Comment t\'appelles-tu ?'; $('#modal-form').hidden = false; $('#inp-name').focus(); }
setTimeout(settleModal, 8000);
(window.claude && window.claude.hot && window.claude.hot.ready) ? window.claude.hot.ready(boot) : boot();
initCloud();
