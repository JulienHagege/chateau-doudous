<style>
/* ---------- Orage (événement surprise, plein écran) ---------- */
#storm{position:fixed; inset:0; z-index:15; background:#050309; overflow:hidden}
#storm canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
#storm .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:2}
#storm .ui{position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; justify-content:space-between; align-items:center; pointer-events:none;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:max(14px, env(safe-area-inset-top,0px)) max(14px, env(safe-area-inset-bottom,0px))}
#storm .stitle{font-family:var(--font-display); font-size:clamp(24px,5vw,44px); color:#ffb347; text-shadow:0 0 24px rgba(255,140,0,.8), 0 3px 0 #3a1a00; text-align:center; min-height:44px}
#storm .bottom{display:flex; flex-direction:column; align-items:center; gap:10px; width:min(100%,760px); pointer-events:auto}
#storm .sq{font-family:var(--font-display); font-size:clamp(34px,8vw,64px); color:#fff; text-align:center; min-height:50px; text-shadow:0 0 20px rgba(255,140,0,.7), 0 4px 0 rgba(0,0,0,.6)}
#storm .opts{width:100%; grid-template-columns:repeat(3,minmax(0,1fr))}
#storm .opt{background:rgba(40,20,60,.75); border-color:rgba(255,160,60,.6); font-size:clamp(28px,6vw,40px); padding:14px 8px; backdrop-filter:blur(3px)}
#storm .sinfo{display:flex; gap:16px; color:#ffd9a8; font-weight:900; font-size:17px; flex-wrap:wrap; justify-content:center; text-shadow:0 2px 0 rgba(0,0,0,.6)}
.shake{animation:shake .35s}
.dim{animation:dimout 2.2s ease forwards}
@keyframes dimout{to{filter:brightness(.05)}}

/* ---------- Intro (livre de contes) ---------- */
.intro{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center}
.intro .scene{position:relative; width:min(100%,620px); aspect-ratio:3/2; border-radius:20px; overflow:hidden; border:4px solid #4a3f8a; box-shadow:var(--shadow); background:#0e0c22}
.intro .scene img.bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.intro .scene .night{position:absolute; inset:0; background:radial-gradient(400px 260px at 50% 60%, rgba(255,200,120,.18), transparent 70%)}
.intro .scene .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.intro .scene .row{position:absolute; left:0; right:0; bottom:10px; display:flex; justify-content:center; gap:4px; flex-wrap:wrap; padding:0 10px}
.intro .scene .row img{width:44px; height:44px; object-fit:contain; animation:bob 1.4s ease-in-out infinite}
.intro .scene .row img:nth-child(2n){animation-delay:.2s} .intro .scene .row img:nth-child(3n){animation-delay:.5s}
.intro .scene .row.flee img{animation:flee 1.6s ease-in forwards}
@keyframes flee{0%{transform:translateY(0)} 30%{transform:translateY(-12px)} 100%{transform:translateY(-220px) scale(.4); opacity:0}}
.intro .scene .hero{position:absolute; left:50%; bottom:14px; width:96px; height:96px; margin-left:-48px; object-fit:contain; filter:drop-shadow(0 0 18px rgba(255,200,120,.7)); animation:bob 1.6s ease-in-out infinite}
.intro .scene .peek{position:absolute; left:50%; top:14px; width:84px; height:84px; margin-left:-42px; object-fit:contain; animation:peek 2.4s ease-in-out infinite}
@keyframes peek{0%,100%{transform:translateY(40px)} 50%{transform:translateY(0)}}
.intro .scene .peekmask{position:absolute; left:50%; top:98px; width:120px; height:60px; margin-left:-60px; background:#1a1030; border-radius:8px 8px 0 0}
.intro .scene .pumpk{position:absolute; width:70px; height:70px; object-fit:contain; animation:bob 1.1s ease-in-out infinite; filter:drop-shadow(0 0 10px rgba(255,140,0,.8))}
.intro .scene .big{position:absolute; left:50%; top:50%; width:120px; height:120px; margin:-60px 0 0 -60px; object-fit:contain; animation:bob 1.6s ease-in-out infinite}
.intro .scene .side{position:absolute; bottom:18px; width:64px; height:64px; object-fit:contain; animation:bob 1.6s ease-in-out infinite}
.intro .scene .rules{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; font-family:var(--font-display); font-size:clamp(18px,3.6vw,24px); color:#fff; padding:16px}
.intro .scene .rules span{background:rgba(0,0,0,.45); border-radius:12px; padding:6px 14px}
.intro .text{font-family:var(--font-display); font-size:clamp(20px,4.2vw,28px); color:#fff; max-width:620px; min-height:72px; text-wrap:balance; text-shadow:0 2px 0 rgba(0,0,0,.4)}
.intro .dots{display:flex; gap:8px}
.intro .dots i{width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.2)}
.intro .dots i.on{background:var(--gold); box-shadow:0 0 8px var(--gold)}
</style>
