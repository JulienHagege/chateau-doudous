<script>
/* =========================================================
   MINI-JEUX : chaque salle a son générateur gen(level) -> question, avec 5 niveaux de contenu différents.
   question = {prompt, sub?, kind:'qcm'|'num'|'custom', options?, answer, suffix?, show?, render?(stage, api), timeMult?, fact?}
   api (custom) : api.answer(ok, shown) termine l'épreuve. Les énoncés sont reliés au thème de la salle.
   ========================================================= */
function mkOptions(answer, cand, n=4){
  const set = new Set([answer]); const c = cand.filter(x => x!==answer && x>=0 && Number.isFinite(x));
  for (const x of shuffle(c)){ if (set.size>=n) break; set.add(x); }
  let k = 1; while (set.size<n){ set.add(answer + k); if (set.size<n && answer-k>=0) set.add(answer-k); k++; }
  return shuffle([...set]);
}
function qcm(prompt, answer, cand, extra={}){ return Object.assign({prompt, kind:'qcm', answer, options:mkOptions(answer, cand, extra.n||4), show:String(answer)}, extra); }
function num(prompt, answer, extra={}){ return Object.assign({prompt, kind:'num', answer, show:String(answer)+(extra.suffix?' '+extra.suffix:'')}, extra); }
function mkOptionsStr(answer, cand, n=4){ const set = new Set([answer]); for (const c of cand){ if (set.size>=n) break; set.add(c); } return shuffle([...set]); }
const fmtEuro = c => (c%100===0) ? (c/100)+' €' : Math.floor(c/100)+' € '+String(c%100).padStart(2,'0');
const L = (level, arr) => arr[Math.min(arr.length, Math.max(1, level)) - 1]; // valeur selon le niveau 1..5

/* ---------- Formes (Crabou, le Hall aux vitraux) ---------- */
const SHAPES = {
  carre:{name:'le carré', sides:4, pts:(r)=>[[-r,-r],[r,-r],[r,r],[-r,r]]},
  rectangle:{name:'le rectangle', sides:4, pts:(r)=>[[-r*1.3,-r*.7],[r*1.3,-r*.7],[r*1.3,r*.7],[-r*1.3,r*.7]]},
  triangle:{name:'le triangle', sides:3, pts:(r)=>[[0,-r*1.1],[r*1.1,r*.8],[-r*1.1,r*.8]]},
  rond:{name:'le rond', sides:0, circle:true},
  losange:{name:'le losange', sides:4, pts:(r)=>[[0,-r*1.25],[r*.8,0],[0,r*1.25],[-r*.8,0]]},
  trapeze:{name:'le trapèze', sides:4, pts:(r)=>[[-r*.7,-r*.75],[r*.7,-r*.75],[r*1.3,r*.75],[-r*1.3,r*.75]]},
  parallelogramme:{name:'le parallélogramme', sides:4, pts:(r)=>[[-r*.7,-r*.7],[r*1.3,-r*.7],[r*.7,r*.7],[-r*1.3,r*.7]]},
  ovale:{name:"l'ovale", sides:0, ellipse:true},
  hexagone:{name:"l'hexagone", sides:6, pts:(r)=>Array.from({length:6},(_,i)=>[r*1.05*Math.cos(i*Math.PI/3), r*1.05*Math.sin(i*Math.PI/3)])},
  pentagone:{name:'le pentagone', sides:5, pts:(r)=>Array.from({length:5},(_,i)=>[r*1.1*Math.cos(-Math.PI/2+i*2*Math.PI/5), r*1.1*Math.sin(-Math.PI/2+i*2*Math.PI/5)])},
  octogone:{name:"l'octogone", sides:8, pts:(r)=>Array.from({length:8},(_,i)=>[r*1.05*Math.cos(Math.PI/8+i*Math.PI/4), r*1.05*Math.sin(Math.PI/8+i*Math.PI/4)])}
};
const SOLIDS = {
  cube:{name:'le cube', faces:6, sommets:8}, pave:{name:'le pavé droit', faces:6, sommets:8}, boule:{name:'la boule', faces:0, sommets:0}, cylindre:{name:'le cylindre', faces:0, sommets:0},
  cone:{name:'le cône', faces:0, sommets:1}, pyramide:{name:'la pyramide', faces:5, sommets:5}
};
const SHAPE_COLORS = ['#ff8fb1','#ffd166','#8de3c0','#7cc4ff','#c9b6ff','#ffb347','#ff7a5c','#9ef0ff'];
function shade(hex, k){ const n = parseInt(hex.slice(1),16); const f = c => clamp(Math.round(c*k),0,255); return '#'+[(n>>16)&255,(n>>8)&255,n&255].map(f).map(x=>x.toString(16).padStart(2,'0')).join(''); }
function shapeSvg(id, cx, cy, r, color, rot, cls, data){
  const g = `<g class="${cls}" data-id="${data}" transform="translate(${cx} ${cy}) rotate(${rot})">`;
  if (SOLIDS[id]){
    const st = (c) => `fill="${c}" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"`; const d = shade(color,.7), l = shade(color,1.25); const o = r*.5;
    if (id==='cube') return g + `<polygon points="${-r},${-r*.4} ${o-r},${-r} ${o+r},${-r} ${r},${-r*.4}" ${st(l)}/><polygon points="${r},${-r*.4} ${r+o},${-r} ${r+o},${r*.6} ${r},${r*1.2}" ${st(d)}/><rect x="${-r}" y="${-r*.4}" width="${2*r}" height="${1.6*r}" ${st(color)}/></g>`;
    if (id==='pave') return g + `<polygon points="${-r*1.5},${-r*.2} ${o-r*1.5},${-r*.8} ${o+r*1.5},${-r*.8} ${r*1.5},${-r*.2}" ${st(l)}/><polygon points="${r*1.5},${-r*.2} ${r*1.5+o},${-r*.8} ${r*1.5+o},${r*.4} ${r*1.5},${r}" ${st(d)}/><rect x="${-r*1.5}" y="${-r*.2}" width="${3*r}" height="${1.2*r}" ${st(color)}/></g>`;
    if (id==='boule') return g + `<circle r="${r*1.1}" ${st(color)}/><ellipse cx="${-r*.35}" cy="${-r*.4}" rx="${r*.35}" ry="${r*.22}" fill="rgba(255,255,255,.55)"/></g>`;
    if (id==='cylindre') return g + `<path d="M${-r*.8},${-r*.9} v${1.8*r} a${r*.8},${r*.3} 0 0 0 ${1.6*r},0 v${-1.8*r}" ${st(color)}/><ellipse cx="0" cy="${-r*.9}" rx="${r*.8}" ry="${r*.3}" ${st(l)}/></g>`;
    if (id==='cone') return g + `<path d="M${-r},${r*.7} L0,${-r*1.2} L${r},${r*.7} a${r},${r*.35} 0 0 1 ${-2*r},0 z" ${st(color)}/><path d="M${-r},${r*.7} a${r},${r*.35} 0 0 0 ${2*r},0" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="4 4"/></g>`;
    if (id==='pyramide') return g + `<polygon points="0,${-r*1.2} ${-r*1.1},${r*.8} ${r*.3},${r*1.05}" ${st(color)}/><polygon points="0,${-r*1.2} ${r*.3},${r*1.05} ${r*1.1},${r*.5}" ${st(d)}/></g>`;
  }
  const s = SHAPES[id]; const st = `fill="${color}" stroke="#fff" stroke-width="3" stroke-linejoin="round"`;
  if (s.circle) return g + `<circle r="${r}" ${st}/></g>`;
  if (s.ellipse) return g + `<ellipse rx="${r*1.3}" ry="${r*.8}" ${st}/></g>`;
  return g + `<polygon points="${s.pts(r).map(p=>p.join(',')).join(' ')}" ${st}/></g>`;
}
const GAMES = {};
GAMES.formes = { intro:'Les vitraux du hall brillent. Touche la bonne forme !', gen(level){
  const flat = level===1 ? ['carre','rectangle','triangle','rond','losange'] : ['carre','rectangle','triangle','rond','losange','trapeze','parallelogramme','ovale','hexagone','pentagone','octogone'];
  const solids = Object.keys(SOLIDS);
  const countQ = (id, what) => { const s = SHAPES[id] || SOLIDS[id]; const ans = what==='côtés' ? s.sides : what==='faces' ? s.faces : s.sommets; return {prompt:`Combien de ${what} a ${s.name} ?`, kind:'custom', answer:ans, show:String(ans), explain:`${s.name.charAt(0).toUpperCase()+s.name.slice(1)} a ${ans} ${what}. Compte-les sur le dessin !`, explainShape:id, render(stage, api){
      stage.innerHTML = `<div class="custom"><svg class="shapes" viewBox="0 0 300 150">${shapeSvg(id,150,75,55,pick(SHAPE_COLORS),SOLIDS[id]?0:rnd(0,359),'',id)}</svg><div class="opts three" id="side-opts"></div></div>`;
      const opts = mkOptions(ans, [3,4,5,6,8,0,1], 3); const box = stage.querySelector('#side-opts');
      opts.forEach(o => { const b = document.createElement('button'); b.className='opt'; b.textContent = o; b.onclick = () => { b.classList.add(o===ans?'ok':'ko'); api.answer(o===ans); }; box.appendChild(b); });
    }}; };
  if (level===2 && Math.random()<.3) return countQ(pick(flat.filter(k => SHAPES[k].sides>0)), 'côtés');
  if (level===4 && Math.random()<.4) return countQ(pick(['cube','pave','pyramide']), pick(['faces','sommets']));
  if (level===5 && Math.random()<.4){ const id = pick([...flat.filter(k => SHAPES[k].sides>=5), 'cube','pyramide']); return countQ(id, SHAPES[id] ? 'côtés' : pick(['faces','sommets'])); }
  // niveau 3 : solides ; 4 : solides et formes mêlés ; 5 : tout, tourné, 9 vitraux
  const useSolids = level>=3 && (level===3 ? Math.random()<.75 : Math.random()<.5); const pool = level>=4 && Math.random()<.5 ? [...flat, ...solids] : (useSolids ? solids : flat); const NAMES = Object.assign({}, SHAPES, SOLIDS);
  const count = level>=5 ? 9 : 6; const target = pick(pool); const others = shuffle(pool.filter(k=>k!==target)).slice(0, count-1);
  const items = shuffle([target, ...others]); const cols = count===9 ? 3 : 3, rows = count/cols;
  const T = NAMES[target]; const explain = SHAPES[target] ? (T.sides ? `${T.name.charAt(0).toUpperCase()+T.name.slice(1)} a ${T.sides} côtés${target==='carre' ? ' tous pareils' : target==='rectangle' ? ', deux longs et deux courts' : target==='losange' ? ' pareils, penché comme un cerf-volant' : target==='trapeze' ? ', dont deux parallèles' : ''}.` : `${T.name.charAt(0).toUpperCase()+T.name.slice(1)} n'a pas de côté : il est tout rond${target==='ovale' ? ' et allongé' : ''}.`) : `${T.name.charAt(0).toUpperCase()+T.name.slice(1)} est un solide : ${T.faces ? T.faces+' faces' : 'il roule'}${target==='cube' ? ', toutes carrées' : target==='pave' ? ', comme une boîte' : target==='cone' ? ', avec une pointe' : target==='pyramide' ? ' avec une pointe en haut' : ''}.`;
  return {prompt:`Touche <b>${NAMES[target].name}</b>`, sub: level>=3 ? 'dans les vitraux du hall' : '', kind:'custom', answer:target, show:NAMES[target].name, explain, explainShape:target, render(stage, api){
    const W = 600, H = rows*140 + 20; let svg = `<svg class="shapes" viewBox="0 0 ${W} ${H}">`;
    svg += `<rect width="${W}" height="${H}" rx="16" fill="rgba(0,0,0,.25)"/>`;
    items.forEach((id, i) => { const cx = 100 + (i%cols)*200 + rnd(-20,20), cy = 80 + Math.floor(i/cols)*140 + rnd(-10,10); const rot = (level===1 || SOLIDS[id]) ? 0 : rnd(-40,40);
      svg += shapeSvg(id, cx, cy, count===9 ? 34 : 40, SHAPE_COLORS[i%SHAPE_COLORS.length], rot, 'sh', id); });
    stage.innerHTML = `<div class="custom">${svg}</svg></div>`;
    stage.querySelectorAll('.sh').forEach(g => g.addEventListener('click', () => { const ok = g.dataset.id===target; g.style.filter = ok ? 'drop-shadow(0 0 12px #fff)' : 'brightness(.5)'; api.answer(ok); }));
  }};
}};

/* ---------- Contenances (Poulpou, les Bains) ---------- */
GAMES.bains = { intro:'Poulpou veut un bain à la bonne hauteur. Verse les bons pichets !', gen(level){
  let jugs, target;
  if (level===1){ jugs = [100,200,500]; target = pick([300,400,600,700,800,900,1000,1200]); }
  else if (level===2){ jugs = [25,50,100]; target = pick([75,125,150,175,200,225,250,300]); }
  else if (level===3){ jugs = [10,25,50,100]; target = pick([35,60,85,110,135,160,185,210,260,310]); }
  else if (level===4){ jugs = [5,10,25,50,100,200]; target = pick([115,230,245,315,355,430,465,520]); }
  else { jugs = [5,20,50,100,250,500]; target = pick([275,325,370,575,620,745,825,1070]); }
  const fmt = cl => cl>=100 && cl%100===0 ? (cl/100)+' L' : cl>100 ? Math.floor(cl/100)+' L et '+(cl%100)+' cL' : cl+' cL';
  // niveaux 3 et 5 : cible en cL seuls (il faut convertir) ; niveau 4 : en L et cL
  const label = (level===3 || level===5) ? target+' cL' : fmt(target);
  const sub = level===1 ? 'Poulpou aime les bains bien pleins' : '1 L = 100 cL';
  const plan = (() => { let rest = target; const parts = []; for (const j of jugs.slice().sort((a,b)=>b-a)){ while (rest>=j){ parts.push(fmt(j)); rest -= j; } } return parts.join(' + '); })();
  return {story:`Remplis la baignoire de Poulpou jusqu'à…`, prompt:`<b>${label}</b>`, sub, kind:'custom', answer:target, show:label, explain:`${level===1 ? '' : '1 L = 100 cL. '}${label} = ${fmt(target)} : verse ${plan}.`, timeMult:2.5, render(stage, api){
    let cur = 0; const max = Math.max(target*1.25, jugs[jugs.length-1]*1.2);
    stage.innerHTML = `<div class="custom">
      <div class="tub"><div class="mark" style="top:${100-target/max*100}%">${label}</div><div class="water" id="water"></div></div>
      <div class="gauge" id="gauge">0 cL</div>
      <div class="toolrow" id="jugs"></div>
      <div class="toolrow"><button class="tool" id="empty">🚿 Vider</button></div></div>`;
    const water = stage.querySelector('#water'), gauge = stage.querySelector('#gauge');
    const upd = () => { water.style.height = clamp(cur/max*100,0,100)+'%'; gauge.textContent = level===1 ? fmt(cur) : (cur>=100 ? fmt(cur)+' ('+cur+' cL)' : cur+' cL'); };
    const box = stage.querySelector('#jugs');
    const big = jugs[jugs.length-1];
    jugs.forEach(j => { const b = document.createElement('button'); b.className='jug'; const fh = 8 + Math.round(30*j/big); const cp = 'jc'+j;
      b.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true"><defs><clipPath id="${cp}"><path d="M14 14h36l-4 40H18z"/></clipPath></defs><path d="M14 14h36l-4 40H18z" fill="#f4ead2" stroke="#6b5a3a" stroke-width="3"/><rect x="10" y="${54-fh}" width="44" height="${fh}" fill="#5fb8f0" clip-path="url(#${cp})"/><rect x="10" y="${54-fh}" width="44" height="3" fill="rgba(255,255,255,.6)" clip-path="url(#${cp})"/><path d="M50 18q14 8 0 24" fill="none" stroke="#6b5a3a" stroke-width="3"/><path d="M14 14l-7-5 3 11z" fill="#f4ead2" stroke="#6b5a3a" stroke-width="2"/></svg><b>${fmt(j)}</b>`;
      b.onclick = () => { if (api.done) return; b.classList.remove('pouring'); void b.offsetWidth; b.classList.add('pouring'); cur += j; SFX.pour(); upd(); if (cur===target){ setTimeout(()=>api.answer(true), 400); } else if (cur>target){ water.style.background='linear-gradient(180deg,#ff9a85,#c9452c)'; setTimeout(()=>api.answer(false, 'Ça déborde ! Il fallait '+label), 500); } }; box.appendChild(b); });
    stage.querySelector('#empty').onclick = () => { if (api.done) return; cur = 0; upd(); SFX.click(); };
    upd();
  }};
}};

/* ---------- Longueurs (Hugo, la Galerie des sauts) ---------- */
const RUL = {x0:30, x1:610, y:120};
function drawRuler(cv, maxCm, ribbons, kanga){
  const W = 640, H = 190; cv.width = W; cv.height = H; const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  g.fillStyle = 'rgba(29,58,46,.85)'; g.fillRect(0,0,W,H);
  const x0 = RUL.x0, x1 = RUL.x1, y = RUL.y+20, sc = (x1-x0)/maxCm;
  g.fillStyle = '#f2d98a'; g.fillRect(x0-10, y-10, x1-x0+20, 50);
  g.strokeStyle = '#3a2a05'; g.lineWidth = 2; g.font = 'bold 14px Nunito, sans-serif'; g.fillStyle = '#3a2a05'; g.textAlign = 'center';
  const step = maxCm>40 ? 10 : maxCm>20 ? 5 : 1;
  for (let i=0;i<=maxCm;i++){ const x = x0+i*sc; g.beginPath(); g.moveTo(x, y-10); g.lineTo(x, y-10 + (i%10===0?24:i%5===0?18:12)); g.stroke(); if (i%step===0 || i===maxCm) g.fillText(i, x, y+34); }
  g.textAlign='left'; g.fillText('cm', x1+10, y+10); g.textAlign='center';
  // rubans collés juste au-dessus de la règle (le premier touche presque les graduations), avec des pointillés de leurs bouts jusqu'aux traits : plus facile à lire
  (ribbons||[]).forEach((r, k) => { const ry = y-10 - 28 - k*30; g.save(); g.setLineDash([3,3]); g.strokeStyle = r.color; g.lineWidth = 2; [r.a, r.b].forEach(cm => { g.beginPath(); g.moveTo(x0+cm*sc, ry+22); g.lineTo(x0+cm*sc, y-10); g.stroke(); }); g.restore();
    g.fillStyle = r.color; g.fillRect(x0+r.a*sc, ry, (r.b-r.a)*sc, 22); g.strokeStyle='#fff'; g.lineWidth=2; g.strokeRect(x0+r.a*sc, ry, (r.b-r.a)*sc, 22); if (r.label){ g.fillStyle='#fff'; g.font='bold 16px Fredoka, sans-serif'; g.fillText(r.label, x0+(r.a+r.b)/2*sc, ry+17); } });
  // repères explicites : trait pointillé jusqu'à la règle, flèche et étiquette en cm (départ en bleu, arrivée en jaune)
  const marker = (cm, color, label, yTop) => { const mx = x0 + cm*sc; g.save(); g.setLineDash([4,4]); g.strokeStyle = color; g.lineWidth = 3; g.beginPath(); g.moveTo(mx, yTop); g.lineTo(mx, y-12); g.stroke(); g.restore();
    g.fillStyle = color; g.beginPath(); g.moveTo(mx, y-8); g.lineTo(mx-7, y-20); g.lineTo(mx+7, y-20); g.closePath(); g.fill();
    if (label!=null){ g.font = 'bold 15px Fredoka, Nunito, sans-serif'; const tw = g.measureText(label).width + 12; g.fillStyle = color; g.fillRect(mx-tw/2, yTop-22, tw, 20); g.fillStyle = '#1a1030'; g.textAlign='center'; g.fillText(label, mx, yTop-7); } };
  if (kanga){ const sp = SPR.hugo; const kx = x0 + kanga.pos*sc, ky = y-12 - (kanga.h||0);
    if (kanga.flag!=null){ g.fillStyle='#ff8fb1'; g.fillRect(x0+kanga.flag*sc-2, y-40, 4, 30); g.beginPath(); g.moveTo(x0+kanga.flag*sc+2, y-40); g.lineTo(x0+kanga.flag*sc+22, y-33); g.lineTo(x0+kanga.flag*sc+2, y-26); g.fill(); g.font = 'bold 15px Fredoka, Nunito, sans-serif'; g.fillStyle = '#ff8fb1'; g.textAlign = 'center'; g.fillText(kanga.flag+' cm', x0+kanga.flag*sc, y-46); }
    if (kanga.start!=null) marker(kanga.start, '#7cc4ff', kanga.labels ? kanga.start+' cm' : null, 30);
    if (kanga.land!=null) marker(kanga.land, '#ffd166', kanga.labels ? kanga.land+' cm' : null, 30);
    if (sp && sp.complete) g.drawImage(sp, kx-28, ky-56, 56, 56); else { g.fillStyle='#c58a4a'; g.fillRect(kx-10, ky-30, 20, 30); } }
}
function hopAnim(cv, maxCm, ribbons, from, to, hops, flag, onEnd, labels){
  const start = performance.now(); const dur = 520*hops;
  function frame(t){ const k = clamp((t-start)/dur,0,1); const hk = k*hops, i = Math.min(Math.floor(hk), hops-1), f = hk - i; const pa = from + (to-from)*i/hops, pb = from + (to-from)*(i+1)/hops; const pos = pa + (pb-pa)*f, h = Math.sin(f*Math.PI)*55;
    drawRuler(cv, maxCm, ribbons, {pos, h, flag, start:from, land: k>=1 ? to : null, labels}); if (k<1) requestAnimationFrame(frame); else if (onEnd) onEnd(); }
  requestAnimationFrame(frame);
}
function cmFromClick(cv, maxCm, e){ const r = cv.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width * 640; return Math.round((x - RUL.x0) / ((RUL.x1-RUL.x0)/maxCm)); }
const LEN_ITEMS = [['un crayon',15,'cm'],['une porte',2,'m'],['une fourmi',5,'mm'],['un lit',2,'m'],['une gomme',4,'cm'],['un terrain de foot',100,'m'],['Paris à Marseille',800,'km'],['une cuillère',18,'cm'],['une voiture',4,'m'],['un bus',12,'m'],['un livre',25,'cm'],['une coccinelle',6,'mm'],['la tour Eiffel',300,'m'],['un grain de riz',6,'mm'],['une piscine',25,'m']];
// Départ d'Hugo : au plus deux départs à zéro par salle, sinon il part d'un nombre (même au niveau 1, sinon « 0 + 5 » revient sans arrêt)
function hugoStart(maxFrom){ const r = (typeof run!=='undefined' && run) ? run : null; const zeroOk = !r || (r.zeros||0) < 2; if (zeroOk && Math.random()<.35){ if (r) r.zeros = (r.zeros||0)+1; return 0; } return rnd(1, Math.max(1, maxFrom)); }
GAMES.longueurs = { intro:'Hugo le kangourou saute sur la grande règle. Mesure ses bonds !', gen(level){
  const t = pick(L(level, [['measure','compare','jump','catch','catch'], ['measure','unit','jump','catch','catch'], ['measure','unit','convert','catch','jump','catch'], ['measure','convert','convert2','catch','jump'], ['convert2','convert2','catch','jump','unit','measure']]));
  const max = L(level, [10,20,30,50,100]);
  if (t==='measure'){
    const a = level>=3 ? rnd(1, Math.floor(max*.6)) : hugoStart(Math.floor(max*.5)); const len = rnd(2, Math.min(max-a, L(level,[10,15,15,25,40]))); const b = a+len;
    return {prompt:`Combien mesure le ruban d'Hugo ?`, kind:'num', answer:len, suffix:'cm', show:len+' cm', explain:`Le ruban va de ${a} à ${b} : ${b} − ${a} = ${len} cm. Compte les traits entre le début et la fin.`, render(stage){ const cv = document.createElement('canvas'); cv.className='ruler'; drawRuler(cv, max, [{a,b,color:'#ff8fb1'}]); stage.appendChild(cv); }};
  }
  if (t==='compare'){
    const la = rnd(2, max-1); let lb = rnd(2, max-1); if (lb===la) lb = la===max-1 ? la-1 : la+1;
    const colors = ['#ff8fb1','#7cc4ff']; const ans = la>lb ? 'rose' : 'bleu';
    return {prompt:`Quel ruban est le plus long ?`, kind:'custom', answer:ans, show:'le ruban '+ans, explain:`Le rose mesure ${la} cm, le bleu ${lb} cm.`, render(stage, api){

const BOOK_COLORS = ['#ff8fb1','#ffd166','#8de3c0','#7cc4ff','#c9b6ff','#ffb347','#ff7a5c','#9ef0ff'];
// Une étagère : n livres (paquets de 10 = gros livre marqué 10, puis les unités), ou vide avec un « ? »
function shelfSvg(n, label, opts={}){
  const W = 300, H = 92; const tens = Math.floor(n/10), ones = n%10; let x = 10, endX = 10; let items = '';
  const showTens = n>20 || opts.tens; let i = 0;

  else if (showTens){ for (let k=0;k<tens;k++){ items += `<g class="bk" style="animation-delay:${(i++*.04).toFixed(2)}s"><rect x="${x}" y="22" width="22" height="50" rx="3" fill="${BOOK_COLORS[k%8]}" stroke="#2a1f05" stroke-width="2"/><text x="${x+11}" y="52" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="13" font-weight="700" fill="#2a1f05">10</text></g>`; endX = x+22; x += 26; }
    for (let k=0;k<ones;k++){ items += `<g class="bk" style="animation-delay:${(i++*.04).toFixed(2)}s"><rect x="${x}" y="${34 + (k%2)*4}" width="9" height="${38 - (k%2)*4}" rx="2" fill="${BOOK_COLORS[(k+3)%8]}" stroke="#2a1f05" stroke-width="1.5"/></g>`; endX = x+9; x += 11; } }
  else { const w = n>12 ? 12 : 16, gap = n>12 ? 14 : 18; for (let k=0;k<n;k++){ items += `<g class="bk" style="animation-delay:${(i++*.05).toFixed(2)}s"><rect x="${x}" y="${30 + (k%3)*4}" width="${w}" height="${42 - (k%3)*4}" rx="2" fill="${BOOK_COLORS[k%8]}" stroke="#2a1f05" stroke-width="2"/><rect x="${x+2}" y="${36 + (k%3)*4}" width="${w-4}" height="3" fill="rgba(255,255,255,.5)"/></g>`; endX = x+w; x += gap; } }
  let split = '';
  if (opts.split && n>0){ const mid = (10+endX)/2, half = (endX-10)/2; const lab = half>=70 ? 'la moitié ?' : '?';
    split = `<line x1="${mid}" y1="20" x2="${mid}" y2="90" stroke="#ffd166" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/><text x="${(10+mid)/2}" y="16" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#ffd166">${lab}</text><text x="${(mid+endX)/2}" y="16" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#ffd166">${lab}</text>`; label = ''; }
  return `<svg viewBox="0 0 ${W} ${H}" class="shelf"><rect x="4" y="74" width="${W-8}" height="10" rx="3" fill="#8a5a2a" stroke="#3a2410" stroke-width="2"/><rect x="4" y="84" width="${W-8}" height="4" fill="#5a3a1a"/>${items}${split}<text x="${W/2}" y="16" text-anchor="middle" font-family="Nunito, sans-serif" font-size="13" font-weight="800" fill="#fff">${label}</text></svg>`;
}

function buildSym(grid, cols, rows, horiz, on, onTap){

function tableQ(tables, form){

  const cand = [a*(b+1), a*(b-1), (a+1)*b, (a-1)*b, a+b, ans+2, ans-2];
  let q;
  if (form==='division' && b>1) q = qcm(`${ans} ÷ ${a} = <b>?</b>`, b, [b+1,b-1,b+2,a,ans-a]);
  else if (form==='inverted' && b>1) q = qcm(`<b>?</b> × ${a} = ${ans}`, b, [b+1,b-1,b+2,a,ans-a]);
  else q = Math.random()<.5 ? qcm(`${a} × ${b} = <b>?</b>`, ans, cand) : qcm(`${b} × ${a} = <b>?</b>`, ans, cand);
  q.fact = [a,b]; q.explain = b<=5 ? `${a} × ${b} = ${Array(b).fill(a).join(' + ')} = ${ans}.` : `${a} × ${b} : compte de ${a} en ${a} : ${Array.from({length:b},(_,i)=>a*(i+1)).join(', ')}.`; if (form==='division' && b>1) q.explain = `${ans} ÷ ${a} = ${b}, parce que ${a} × ${b} = ${ans}.`; return q;
}

      const go = () => { if (jet) jet.style.visibility = 'hidden'; rollDice(box, dice, () => { if (jet){ jet.style.visibility = 'visible'; jet.querySelectorAll('.jeton').forEach(j => { j.style.animation = 'none'; void j.offsetWidth; j.style.animation = ''; }); } }); };
      setTimeout(go, 150); box.querySelector('#reroll').onclick = go; }
  };
}};

/* ---------- Additions éclair (Minion, la Forge) ---------- */
GAMES.rapides = { intro:'À la forge, Minion frappe vite. Réponds en un éclair !', gen(level){
  if (level>=5 && Math.random()<.5){ const a = rnd(5,19), b = rnd(1,9); return qcm(`${a} − ${b}`, a-b, [a-b+1,a-b-1,a-b+2,a+b], {n:3, explain:`${a} − ${b} = ${a-b}.`}); }
  if (level>=3 && Math.random()<(level===3?.5:.7)){ const a = rnd(1,9), b = rnd(1,9), c = rnd(1,9); return qcm(`${a} + ${b} + ${c}`, a+b+c, [a+b+c+1,a+b+c-1,a+b+c+2,a+b], {n:3, explain:`${a} + ${b} = ${a+b}, puis + ${c} = ${a+b+c}.`}); }
  if (level>=4 && Math.random()<.5){ const a = rnd(10,19), b = rnd(2,9); return qcm(`${a} + ${b}`, a+b, [a+b+1,a+b-1,a+b+2,a+b-2], {n:3, explain:`${a} + ${b} = ${a+b}.`}); }
  const max = level===1 ? 10 : 18; let a = rnd(1,9), b = rnd(1,9); while (a+b>max){ a = rnd(1,9); b = rnd(1,9); }
  return qcm(`${a} + ${b}`, a+b, [a+b+1,a+b-1,a+b+2,a+b-2,a*b], {n:3, explain:`${a} + ${b} = ${a+b}${a+b>10 ? ' : ' + a + ' + ' + (10-a) + ' = 10, puis + ' + (b-(10-a)) : ''}.`});
}};

/* ---------- Ranger les nombres (Meryl, le Grenier) : comparer, ordonner, pair ou impair ---------- */
function bigQcm(prompt, answer, options, extra={}){ return Object.assign({prompt, kind:'qcm', answer, options, show:String(answer)}, extra); }
const digits = n => n<10 ? 1 : n<100 ? 2 : n<1000 ? 3 : 4;
function explainCompare(a, b){ const big = Math.max(a,b), small = Math.min(a,b); if (digits(big)!==digits(small)) return `${big} a ${digits(big)} chiffres et ${small} en a ${digits(small)} : ${big} est plus grand.`; const d = digits(big); const unit = d===3 ? 'centaines' : 'dizaines'; const hb = Math.floor(big/Math.pow(10,d-1)), hs = Math.floor(small/Math.pow(10,d-1)); if (hb!==hs) return `${big} a ${hb} ${unit}, ${small} en a ${hs} : ${big} est plus grand.`; return `Même ${d===3?'centaine':'dizaine'} : on regarde la suite. ${big} est plus grand que ${small}.`; }
GAMES.rangement = { intro:'Dans le grenier, Meryl range les nombres du plus petit au plus grand.', gen(level){
  const t = pick(L(level, [['compare','compare','parity','order3'], ['compare','order3','parity','between'], ['compare','order4','parity','between'], ['order4','between','parity','truefalse','compare'], ['order5','parity','nearest','truefalse','between']]));
  const maxN = L(level, [99, 99, 999, 999, 9999]); const minN = L(level, [10, 10, 100, 100, 10]);
  const num2 = () => rnd(minN, maxN);
  if (t==='compare'){ let a = num2(), b = num2(); while (b===a) b = num2(); const bigger = Math.random()<.6; const ans = bigger ? Math.max(a,b) : Math.min(a,b);
    const opts = shuffle([a,b]);
    return bigQcm(`Quel nombre est le <b>plus ${bigger?'grand':'petit'}</b> ?`, ans, opts, {story:'Meryl doit ranger deux boîtes.', explain:explainCompare(a,b), onAnswer(stage, box){ const el = document.createElement('div'); el.className = 'cmp'; el.innerHTML = `<span>${opts[0]}</span><span class="sym">${opts[0]<opts[1] ? '&lt;' : '&gt;'}</span><span>${opts[1]}</span><small>la pointe du signe montre le plus petit, l'ouverture le plus grand</small>`; box.parentNode.insertBefore(el, box); }, explainHtml:`<div class="lastdigit"><b>${String(Math.min(a,b))[0]}</b>${String(Math.min(a,b)).slice(1)} &lt; <b>${String(Math.max(a,b))[0]}</b>${String(Math.max(a,b)).slice(1)}</div>`, n:2}); }
  if (t==='parity'){ const n = L(level, [rnd(1,20), rnd(10,99), rnd(10,99), rnd(100,999), rnd(100,9999)]); const even = n%2===0;
    const dots = n<=20 ? `<div class="pairdots">${Array.from({length:Math.floor(n/2)},()=>'<i></i><i></i>').map(x=>`<span>${x}</span>`).join('')}${n%2 ? '<span class="odd"><i></i></span>' : ''}</div>` : `<div class="lastdigit">${String(n).slice(0,-1)}<b>${n%10}</b></div>`;
    return bigQcm(`<b>${n}</b> : pair ou impair ?`, even ? 'pair' : 'impair', ['pair','impair'], {story:'Meryl range les nombres pairs à gauche, les impairs à droite.',
      explain:`Un nombre pair, on peut le partager en 2 parts égales, sans reste : il finit par 0, 2, 4, 6 ou 8. Un nombre impair, il en reste toujours 1 tout seul : il finit par 1, 3, 5, 7 ou 9. ${n} finit par ${n%10}, donc ${n} est ${even?'pair':'impair'}.`, explainHtml:dots}); }
  if (t==='between'){ const lo = level<=2 ? rnd(10,80) : rnd(100,900); const span = level<=2 ? rnd(5,15) : rnd(20,80); const hi = lo+span; const ans = rnd(lo+1, hi-1); const cand = [lo-rnd(1,9), hi+rnd(1,9), lo-rnd(10,30), hi+rnd(10,30)].filter(x=>x>0);
    return bigQcm(`Quel nombre est <b>entre ${lo} et ${hi}</b> ?`, ans, mkOptions(ans, cand, 4), {story:'Meryl cherche la boîte qui va entre les deux.', explain:`${ans} est plus grand que ${lo} et plus petit que ${hi}.`}); }
  if (t==='nearest'){ const target = pick([100,200,500,1000]); const ans = target + pick([-1,1])*rnd(1,15); const cand = [target + pick([-1,1])*rnd(20,60), target + pick([-1,1])*rnd(70,150), target + pick([-1,1])*rnd(200,400)].filter(x=>x>0);
    return bigQcm(`Quel nombre est le <b>plus proche de ${target}</b> ?`, ans, mkOptions(ans, cand, 4), {story:'Meryl range près de la grande boîte ' + target + '.', explain:`${ans} est à ${Math.abs(ans-target)} de ${target}, les autres sont plus loin.`}); }
  if (t==='truefalse'){ let a = num2(), b = num2(); while (b===a) b = num2(); const sign = pick(['>','<']); const truth = sign==='>' ? a>b : a<b; const claim = Math.random()<.5;
    const shown = claim===truth ? sign : (sign==='>' ? '<' : '>'); const isTrue = shown==='>' ? a>b : a<b;
    return bigQcm(`<b>${a} ${shown} ${b}</b> : vrai ou faux ?`, isTrue ? 'vrai' : 'faux', ['vrai','faux'], {story:'Le signe ouvert regarde vers le plus grand.', explain:`${explainCompare(a,b)} Donc ${a} ${a>b?'>':'<'} ${b}.`}); }
  // order3 / order4 / order5 : toucher les boîtes du plus petit au plus grand
  const k = t==='order3' ? 3 : t==='order4' ? 4 : 5; const set = new Set(); while (set.size<k) set.add(level>=5 ? pick([rnd(10,99), rnd(100,999), rnd(1000,9999)]) : num2()); const nums = [...set]; const sorted = nums.slice().sort((x,y)=>x-y); const asc = level<=3 || Math.random()<.6; const target = asc ? sorted : sorted.slice().reverse();
  // explication : d'abord le nombre de chiffres, puis le premier chiffre, puis le suivant
  const dcs = [...new Set(target.map(digits))]; const d = digits(target[0]); const unitName = d===4 ? 'milliers' : d===3 ? 'centaines' : 'dizaines';
  const firsts = target.map(v => String(v)[0]); const sameFirst = new Set(firsts).size < firsts.length;
  const rule = dcs.length>1 ? `Un nombre qui a plus de chiffres est plus grand : ${target.map(v => v+' ('+digits(v)+' chiffres)').join(', ')}.` : `Ils ont tous ${d} chiffres : on regarde d'abord les ${unitName} (${firsts.join(', ')})${sameFirst ? ', et quand elles sont pareilles, le chiffre suivant' : ''}.`;
  const ordered = target.map(v => `<b>${String(v)[0]}</b>${String(v).slice(1)}`).join(asc ? ' &lt; ' : ' &gt; ');
  return {story:`Meryl range ${k} boîtes sur l'étagère.`, prompt:`Touche les nombres du <b>plus ${asc?'petit':'grand'}</b> au <b>plus ${asc?'grand':'petit'}</b>`, kind:'custom', answer:target.join(' '), show:target.join(asc ? ' < ' : ' > '), explain:`${rule} Dans l'ordre : ${target.join(asc ? ' < ' : ' > ')}.`, explainHtml:`<div class="lastdigit">${ordered}</div>`, timeMult:2, render(stage, api){
    stage.innerHTML = `<div class="custom"><div class="boxes" id="boxes">${shuffle(nums).map(n => `<button class="boxn" data-n="${n}">${n}</button>`).join('')}</div><div class="shelfrow" id="shelfrow"><span class="sub" style="margin:0">${asc ? 'du plus petit ➜ au plus grand' : 'du plus grand ➜ au plus petit'}</span></div></div>`;
    const picked = []; const row = stage.querySelector('#shelfrow');
    stage.querySelectorAll('.boxn').forEach(b => b.onclick = () => { if (api.done || b.disabled) return; const n = +b.dataset.n; const expected = target[picked.length];
      if (n!==expected){ b.classList.add('ko'); api.done = true; target.forEach((v,i) => { const el = stage.querySelector(`.boxn[data-n="${v}"]`); if (el){ el.classList.add('ok'); el.dataset.pos = i+1; } }); setTimeout(() => api.answer(false, `L'ordre était ${target.join(asc ? ' < ' : ' > ')}`), 500); return; }
      picked.push(n); b.disabled = true; b.classList.add('placed'); SFX.coin(); const c = document.createElement('span'); c.className = 'boxn placed'; c.textContent = n; row.appendChild(c);
      if (picked.length===target.length){ api.done = true; setTimeout(() => api.answer(true), 400); } });
  }};
}};

/* ---------- Boss (Vachou) : mélange de tout le château, au niveau déjà réussi dans chaque salle ---------- */
GAMES.boss = { intro:'Vachou se cache au sommet. Toutes les énigmes du château, en trois vagues !', gen(level, i, n){
  const phase = i < n/3 ? 0 : i < 2*n/3 ? 1 : 2;
  const pool = phase===0 ? ['formes','doubles','complements','longueurs','bains','rangement'] : phase===1 ? ['monnaie','horloge','tables1','soustraction','symetrie','arrondi'] : ['addition','des','tables2','rapides','tables2','rangement'];
  const g = pick(pool); const q = GAMES[g].gen(Math.min(MAX_LEVEL, playedLevel(g))); q.from = g; return q;
}};

/* ---------- Révision : moitié multiplications à revoir, moitié notions en cours ---------- */
GAMES.revision = { intro:'On revoit ce qui a posé problème.', gen(level, i, n){
  const wf = weakFacts(), wr = weakRooms();
  if (wf.length && (Math.random()<.5 || !wr.length)){ const [a,b] = pick(wf); const ans = a*b; const q = qcm(`${a} × ${b} = <b>?</b>`, ans, [a*(b+1),a*(b-1),(a+1)*b,ans+2,ans-2]); q.fact = [a,b]; q.from = 'tables2'; q.explain = b<=5 ? `${a} × ${b} = ${Array(b).fill(a).join(' + ')} = ${ans}.` : `${a} × ${b} : compte de ${a} en ${a} : ${Array.from({length:b},(_,i)=>a*(i+1)).join(', ')}.`; return q; }
  const pool = wr.length ? wr : ROOMS.filter(r => !r.boss && everDone(r.id)); const r = pool.length ? pick(pool) : ROOMS[0];
  const q = GAMES[r.id].gen(Math.min(MAX_LEVEL, playedLevel(r.id))); q.from = r.id; return q;
}};
</script>
